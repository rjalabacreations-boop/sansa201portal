let resolvedHistory = [];
let announcement = { text:'', updatedAt:'', updatedBy:'' };
// This is the app's built-in default track — every school gets this out of the box unless they
// explicitly set (or explicitly remove) their own in Settings → Background Music.
let bgMusic = { url:'https://archive.org/download/sweet-spring-jazz-music-instrumental-relaxing-jazz-music-soft-elegant-bossa-nova-for-upbeat-mo/Sweet%20Spring%20Jazz%20Music%20Instrumental%20Relaxing%20Jazz%20Music%20%26%20Soft%20Elegant%20Bossa%20Nova%20for%20Upbeat%20Mo.mp3', updatedAt:'', updatedBy:'' };
let userInteracted = false;
async function loadAnnouncement(){
  if(!isGoogleConfigured()) return;
  try{ announcement = await appsScriptCall('getAnnouncement', {}); render(); }catch(e){ /* stay quiet — announcement is a nice-to-have, not critical */ }
}
let licenseStatus = ''; // only ever set to 'Unauthorized' by an explicit response — everything else means proceed normally
async function pingDeveloperTracker(){
  if(!DEVELOPER_TRACKING_URL || !isAdmin()) return;
  try{
    const schoolName = schools.find(s=>s.id===currentSchoolId)?.name || 'Unnamed school';
    const res = await fetch(DEVELOPER_TRACKING_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'checkin', schoolName, checkedInAt: new Date().toISOString() })
    });
    const data = await res.json();
    // Fail-safe: only an exact, explicit "Unauthorized" response changes anything here. A network
    // error, a malformed response, or this fetch simply failing all leave licenseStatus untouched
    // (blank), so a temporary outage or hiccup on the tracker's end can never interrupt a school's
    // own legitimate use of their own data.
    licenseStatus = (data && data.status === 'Unauthorized') ? 'Unauthorized' : '';
    render();
  }catch(e){ /* stay quiet — this should never interrupt or block normal app use */ }
}
async function loadMusicSettings(){
  if(!isGoogleConfigured()) return;
  try{
    const res = await appsScriptCall('getMusicSettings', {});
    // Only replace the built-in default if this school has explicitly saved something before —
    // checked via updatedAt rather than url, so a deliberate "Remove Music" (which saves url as
    // blank, but still sets updatedAt) is correctly respected as "no music, on purpose" instead
    // of silently falling back to the built-in default again.
    if(res && res.updatedAt) bgMusic = res;
    applyMusicSource();
  }catch(e){ /* stay quiet — music is a nice-to-have, not critical */ }
}
function toDrivePlayableUrl(url){
  if(!url) return '';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
  // Deliberately NOT using export=download here — that format tells the browser to download the
  // file rather than stream it inline, which fails silently in an <audio> element (no error, it
  // just never plays). This format is the one that reliably works for inline playback instead.
  return m ? `https://drive.google.com/uc?id=${m[1]}` : url;
}
function applyMusicSource(){
  const audio = document.getElementById('bgMusicPlayer');
  if(!audio) return;
  const src = toDrivePlayableUrl(bgMusic.url);
  const btn = document.getElementById('musicToggleBtn');
  if(!src){ audio.pause(); audio.removeAttribute('src'); if(btn) btn.classList.add('hidden-no-music'); return; }
  if(btn) btn.classList.remove('hidden-no-music');
  if(audio.getAttribute('src') !== src){ audio.src = src; }
  tryPlayMusic();
}
function isMusicMuted(){
  const stored = localStorage.getItem('bgMusicMuted');
  return stored===null ? true : stored==='true'; // muted by default until the person opts in themselves
}
function setMusicMuted(muted){
  localStorage.setItem('bgMusicMuted', muted ? 'true' : 'false');
  const audio = document.getElementById('bgMusicPlayer');
  if(audio) audio.muted = muted;
  const btn = document.getElementById('musicToggleBtn');
  if(btn) btn.textContent = muted ? '🔇' : '🔊';
}
function tryPlayMusic(){
  const audio = document.getElementById('bgMusicPlayer');
  if(!audio || !audio.getAttribute('src')) return;
  audio.muted = isMusicMuted();
  audio.volume = 0.35;
  if(userInteracted) audio.play().catch(()=>{ /* browser blocked it — will retry after next interaction */ });
}
(function wireMusicErrorHandling(){
  const audio = document.getElementById('bgMusicPlayer');
  if(!audio) return;
  audio.addEventListener('error', ()=>{
    if(!isMusicMuted() && audio.getAttribute('src')) toast('⚠ The background music track failed to load — the admin may need to try a different audio file.');
  });
})();
function markUserInteracted(){
  if(userInteracted) return;
  userInteracted = true;
  tryPlayMusic();
}
document.addEventListener('click', markUserInteracted);
document.addEventListener('keydown', markUserInteracted);
(function setupAutoLogout(){
  ['click','keydown','mousemove','touchstart','scroll'].forEach(evt=>document.addEventListener(evt, markActivity, {passive:true}));
  setInterval(checkAutoLogout, 30000);
})();
(function setupMobileMenu(){
  const menuBtn = document.getElementById('mobileMenuBtn');
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebarBackdrop');
  if(!menuBtn || !sidebar || !backdrop) return;
  const closeMenu = ()=>{ sidebar.classList.remove('open'); backdrop.classList.remove('open'); };
  menuBtn.addEventListener('click', ()=>{
    const isOpen = sidebar.classList.toggle('open');
    backdrop.classList.toggle('open', isOpen);
  });
  backdrop.addEventListener('click', closeMenu);
})();
(function setupMusicToggle(){
  const btn = document.getElementById('musicToggleBtn');
  if(btn){
    btn.textContent = isMusicMuted() ? '🔇' : '🔊';
    if(!bgMusic.url) btn.classList.add('hidden-no-music');
    btn.addEventListener('click', ev=>{
      ev.stopPropagation();
      const nowMuted = !isMusicMuted();
      setMusicMuted(nowMuted);
      if(!nowMuted){ tryPlayMusic(); toast('🔊 Music unmuted' + (bgMusic.url ? '' : ' — no track is currently set')); }
      else toast('🔇 Music muted');
    });
  }
})();
function pendingDebugLine(sub){
  if(sub._debugLinkedId===undefined || sub._debugLinkedId===null) return '';
  const found = sub._debugRecordFound===true || sub._debugRecordFound==='true';
  return `<div class="hint" style="font-family:monospace; font-size:10px; margin-top:4px; opacity:.75;">🔍 At submission: linked to "${esc(sub._debugLinkedId||'(none)')}" · matching record found: ${found ? 'yes' : 'no'} · tagged: ${esc(sub.kind)}</div>`;
}
function renderPending(){
  const list = pending.filter(x=>x.schoolId===currentSchoolId && x.status!=='Approved' && x.status!=='Rejected');
  return `
    <div class="topline"><div><div class="eyebrow">Review Queue</div><h1>Pending Approvals</h1></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${isGoogleConfigured() ? `<button class="btn ghost small" id="checkNewSubmissionsBtn">🔄 Check for New Submissions</button>` : ''}
        ${isGoogleConfigured() ? `<button class="btn ghost small" id="toggleResolvedHistoryBtn">${state.showResolvedHistory ? 'Hide' : 'View'} Resolved History</button>` : ''}
      </div>
    </div>
    <div class="lane-divider"></div>
    ${isGoogleConfigured() ? `<div class="notice blue">Employees' submissions sync to your shared backend automatically the moment they submit — click "Check for New Submissions" above any time to pull in what's arrived since you last opened this page.</div>` : ''}
    ${list.length ? list.map(sub=>`
      <div class="pending-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
          <div><strong>${esc((sub.firstName||'')+' '+(sub.lastName||''))}</strong> ${sub.kind==='update'?'<span class="due-pill soon">Update Request</span>':'<span class="due-pill" style="background:#E1EFE8;color:var(--court-dark);">New Hire</span>'}<div class="hint">Submitted ${new Date(sub.submittedAt).toLocaleString()} · ${esc(sub.deptEmail||'no email given')}</div>${pendingDebugLine(sub)}</div>
          <div style="display:flex;gap:8px;"><button class="btn small" data-approve="${sub._uid}">${sub.kind==='update'?'Approve Update':'Approve & Create Record'}</button><button class="btn ghost small" data-reject="${sub._uid}">Reject</button></div>
        </div>
      </div>`).join('') : `<div class="empty-state">No pending submissions right now.</div>`}
    ${state.showResolvedHistory ? `
      <div class="section-title" style="margin-top:24px;">Resolved History (Approved & Rejected)</div>
      ${resolvedHistory.length ? resolvedHistory.filter(x=>x.schoolId===currentSchoolId).sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt)).map(sub=>`
        <div class="pending-card" style="opacity:.85;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
            <div><strong>${esc((sub.firstName||'')+' '+(sub.lastName||''))}</strong> ${sub.kind==='update'?'<span class="due-pill soon">Update Request</span>':'<span class="due-pill" style="background:#E1EFE8;color:var(--court-dark);">New Hire</span>'} <span class="due-pill ${sub.status==='Approved'?'':'over'}" style="${sub.status==='Approved'?'background:#DDEFE3;color:#1B6B3A;':''}">${esc(sub.status)}</span><div class="hint">Submitted ${new Date(sub.submittedAt).toLocaleString()} · ${esc(sub.deptEmail||'no email given')}${sub.status==='Rejected' && sub.rejectionReason ? ' · Reason: '+esc(sub.rejectionReason) : ''}</div>${pendingDebugLine(sub)}</div>
          </div>
        </div>`).join('') : `<div class="hint">No resolved history loaded yet — click "View Resolved History" above to fetch it.</div>`}
    ` : ''}
  `;
}

/* ============================================================= NOTIFICATIONS ============================================================= */
function renderNotifications(){
  const alerts = computeAlerts();
  const pendingHere = pending.filter(x=>x.schoolId===currentSchoolId && x.status!=='Approved' && x.status!=='Rejected');
  return `
    <div class="topline"><div><div class="eyebrow">Automated Alerts</div><h1>Notifications</h1></div>
      <button class="btn small ${isGoogleConfigured()?'':'ghost'}" id="sendDigestBtn">${isGoogleConfigured()?'Send Digest Email Now':'Connect Google Backend to email a digest'}</button>
    </div>
    <div class="lane-divider"></div>
    <div class="notice blue">In-app alerts appear ${settings.notifyEarlyDays} days before (early notice) and ${settings.notifyFinalDays} days before (final notice). Email digests send via your Google backend — enable and set recipients in Settings, and make sure your backend connection is set up.</div>
    <div class="section-title">Due Soon (${alerts.length})</div>
    ${alerts.length ? alerts.map(a=>`
      <div class="alert-card ${a.due.cls==='over'?'urgent':''}">${photoOrFallback(a.p,'photo')}
        <div style="flex:1;"><div class="ac-title">${esc(fullName(a.p))} — ${esc(a.type)}</div><div class="ac-sub">Scheduled ${fmtDate(a.date)} · <span class="due-pill ${a.due.cls}">${esc(a.due.label)}</span></div></div>
        <div style="display:flex; gap:8px; flex-shrink:0;">
          ${a.type==='Birthday' ? `<button class="btn small" data-ack-birthday="${a.p._uid}" data-bday-date="${esc(fmtDate(a.date))}">Okay</button>` : ''}
          <button class="btn ghost small" data-open="${a.p._uid}">Open Profile</button>
        </div>
      </div>`).join('') : `<div class="hint">Nothing due within the alert window.</div>`}
    <div class="section-title" style="margin-top:24px;">Pending Submissions (${pendingHere.length})</div>
    ${pendingHere.length ? `<div class="hint">${pendingHere.length} submission(s) awaiting review. <a href="#" data-nav="pending" style="color:var(--court);font-weight:600;">Go to Pending Approvals →</a></div>` : `<div class="hint">None right now.</div>`}
    <div class="section-title" style="margin-top:24px;">Recent Activity</div>
    ${activityLog.length ? activityLog.slice(0,15).map(a=>`<div class="activity-row"><div class="at">${new Date(a.at).toLocaleString()}</div><div>${esc(a.message)}</div></div>`).join('') : `<div class="hint">No activity recorded yet.</div>`}
  `;
}

/* ============================================================= SETTINGS ============================================================= */
function renderSettings(){
  return `
    <div class="topline"><div><div class="eyebrow">Configuration</div><h1>Settings</h1></div></div>
    <div class="lane-divider"></div>

    <div class="settings-section card">
      <h3>School Announcement</h3>
      <div class="hint" style="margin-bottom:10px;">Shown to everyone — on the Dashboard for admins/public, and on My Profile for employees. Clear the text and save to remove it.</div>
      <div class="fields">
        <div class="field full"><label>Announcement Text</label><textarea id="st_announcement" rows="3" placeholder="e.g. General Assembly on Friday, July 25 at 2:00 PM — attendance required for all permanent staff.">${esc(announcement.text)}</textarea></div>

      ${announcement.updatedAt ? `<div class="hint">Last posted by ${esc(announcement.updatedBy||'admin')} · ${new Date(announcement.updatedAt).toLocaleString()}</div>` : ''}

      ${bgMusic.url ? (bgMusic.updatedAt ? `<div class="hint" style="margin-bottom:8px;">Current track set by ${esc(bgMusic.updatedBy||'admin')} · ${new Date(bgMusic.updatedAt).toLocaleString()}</div>` : `<div class="hint" style="margin-bottom:8px;">Using the app's built-in default track — upload your own below, or remove it if you'd rather have no music at all.</div>`) : `<div class="hint" style="margin-bottom:8px;">No background music set — removed on purpose.</div>`}

      <div class="hint" style="margin-bottom:8px;">Keep it under 15MB — a short instrumental loop works best, both because the player already loops it automatically, and because a larger file risks Google Drive showing a warning page instead of actually playing it. Search "compress mp3 online" if your file is too large.</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        ${isGoogleConfigured() ? `<input type="file" accept="audio/*" id="musicUploadInput">` : `<div class="hint">Connect a Google backend in Settings first to enable upload.</div>`}

      <div class="field full" style="margin-bottom:10px;"><label>Direct Audio URL</label><input type="text" id="musicUrlDirectField" placeholder="e.g. https://example.com/music/track.mp3" value="${esc(bgMusic.url)}"></div>
      <div class="hint" style="margin-bottom:10px;">Paste a link to an audio file hosted somewhere meant for direct streaming — a royalty-free music site's direct .mp3 link works well.</div>
      <button class="btn small" id="saveMusicBtn">Save URL</button>

    <div class="settings-section card">
      <h3>Automation Rules</h3>
      <div class="fields">
        <div class="field"><label>Step Increment Cycle (years)</label><input type="text" id="st_step" value="${settings.stepIncrementYears}"></div>
        <div class="field"><label>Loyalty — First Award (years)</label><input type="text" id="st_loy1" value="${settings.loyaltyFirstYears}"></div>
        <div class="field"><label>Loyalty — Repeat Every (years)</label><input type="text" id="st_loy2" value="${settings.loyaltyIntervalYears}"></div>
        <div class="field"><label>Early Notice (days before)</label><input type="text" id="st_early" value="${settings.notifyEarlyDays}"></div>
        <div class="field"><label>Final Notice (days before)</label><input type="text" id="st_final" value="${settings.notifyFinalDays}"></div>
      </div>
      <div class="hint" style="margin-top:12px; padding-top:10px; border-top:1px solid var(--line);"><strong>Birthday Notifications</strong> use their own separate notice window instead of the Early/Final Notice settings above, since a birthday reminder is usually only useful a day or so ahead — not weeks.</div>
      <div class="fields" style="margin-top:8px;">
        <div class="field"><label>Enable Birthday Notifications</label><select id="st_bday_enabled"><option value="yes" ${settings.birthdayNotifyEnabled?'selected':''}>On</option><option value="no" ${!settings.birthdayNotifyEnabled?'selected':''}>Off</option></select></div>
        <div class="field"><label>Notify (days before)</label><input type="text" id="st_bday_days" value="${settings.birthdayNotifyDaysBefore}"></div>
      </div>
      <div class="hint" style="margin-top:12px; padding-top:10px; border-top:1px solid var(--line);"><strong>Auto-Logout</strong> — automatically signs anyone out after a period of inactivity, so an unattended, still-logged-in device isn't a security risk. Applies to Admin and Employee accounts alike.</div>
      <div class="fields" style="margin-top:8px;">
        <div class="field"><label>Log out after (minutes of inactivity)</label><input type="text" id="st_autologout" value="${settings.autoLogoutMinutes}"></div>
      </div>
      <button class="btn small" id="saveAutomationBtn" style="margin-top:12px;">Save Automation Rules</button>
    </div>

    <div class="settings-section card">
      <h3>Email Notifications</h3>
      <div class="hint" style="margin-bottom:10px;">Sends via Gmail using your own signed-in Google account — only works while you're signed in here. There is no background/offline sending.</div>
      <div class="fields">
        <div class="field"><label>Enable Email Notifications</label><select id="ne_enabled"><option value="no" ${!settings.notifyEmail.enabled?'selected':''}>Off</option><option value="yes" ${settings.notifyEmail.enabled?'selected':''}>On</option></select></div>
        <div class="field full"><label>Notify Recipients (comma-separated)</label><input type="text" id="ne_recipients" value="${esc(settings.notifyEmail.recipients)}" placeholder="admin1@deped.gov.ph, admin2@deped.gov.ph"></div>
      </div>
      <button class="btn small" id="saveEmailCfgBtn" style="margin-top:12px;">Save Email Settings</button>
    </div>

    <div class="settings-section card">
      <h3>Users & Access</h3>
      <div class="hint" style="margin-bottom:10px;">Only Admin accounts can see personnel data, settings, and approvals. Employee accounts can only log in to fill out the New Hire Form until they're linked to a record below — after that, they see My Profile instead.</div>
      <table class="ssl-table"><thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Linked Record</th><th></th></tr></thead>
      <tbody>${users.map(u=>{
        if(u.role!=='employee') return `<tr><td class="mono">${esc(u.username)}</td><td>${esc(u.displayName)}</td><td>${esc(u.role)}</td><td class="hint">—</td><td style="white-space:nowrap;"><button class="btn ghost small" data-reset-pw="${esc(u.username)}">Reset Password</button> ${u.username!==session.user?.username?`<button class="btn danger small" data-remove-user="${esc(u.username)}">Remove</button>`:'<span class="hint">(you)</span>'}</td></tr>`;
        const peopleHere = activePersonnel();
        return `<tr><td class="mono">${esc(u.username)}</td><td>${esc(u.displayName)}</td><td>${esc(u.role)}</td>
          <td><select data-link-user="${esc(u.username)}" style="min-width:180px;">
            <option value="">— Not linked —</option>

          <td style="white-space:nowrap;"><button class="btn ghost small" data-reset-pw="${esc(u.username)}">Reset Password</button> ${u.username!==session.user?.username?`<button class="btn danger small" data-remove-user="${esc(u.username)}">Remove</button>`:'<span class="hint">(you)</span>'}</td></tr>`;
      }).join('') || `<tr><td colspan="5" class="hint">No users yet.</td></tr>`}</tbody></table>
      <div class="hint" style="margin-top:6px;">Linking normally happens automatically when you approve a New Hire submission. If you added a personnel record yourself (Add Personnel) instead of through that flow, use this dropdown to connect the employee's account to their record manually — this is also how to fix a wrong link or move an account to a different record.</div>
      <div class="hint" style="margin-top:6px;">Passwords are never stored in a form that can be displayed back — only a one-way scrambled version, for security. There's no "reveal password" option, even for admins; use Reset Password to set a new one when needed.</div>
      <div class="section-title">Add User</div>
      <div class="fields">
        <div class="field"><label>Full Name</label><input type="text" id="nu_name"></div>
        <div class="field"><label>Username</label><input type="text" id="nu_user"></div>
        <div class="field"><label>Password</label><div class="photo-row"><input type="password" id="nu_pass"><button type="button" class="eye-btn" data-toggle-eye="nu_pass">Show</button></div></div>
        <div class="field"><label>Role</label><select id="nu_role"><option value="employee">Employee (New Hire Form only)</option><option value="admin">Admin (full access)</option></select></div>

      <button class="btn small" id="addUserBtn" style="margin-top:10px;">Create Account</button>

      <h3>Stations / Schools</h3>

        return `<tr>
          <td>${s.logo?`<img class="logo-thumb" src="${esc(s.logo)}" alt="logo">`:`<div class="logo-thumb-empty">No logo</div>`}<input type="file" accept="image/*" data-school-logo="${s.id}" style="margin-top:6px;font-size:10px;max-width:110px;"><div class="hint" style="max-width:110px;">Simple crest works best</div></td>
          <td><input type="text" data-school-name="${s.id}" value="${esc(s.name)}" placeholder="Unnamed station" style="min-width:180px;"></td>

          <td>${s.archived?'<span class="hint">Archived</span>':'<span class="status-pill active">Active</span>'}</td>
          <td style="white-space:nowrap;">
            ${s.archived?`<button class="btn ghost small" data-unarchive-school="${s.id}">Unarchive</button>`:`<button class="btn ghost small" data-archive-school="${s.id}">Archive</button>`}
            <button class="btn danger small" data-delete-school="${s.id}">Delete</button>
          </td>
        </tr>`;
      }).join('')}</tbody></table>
      <div class="actions-row">
        <input type="text" id="newSchoolName" placeholder="New station name…" style="flex:1;min-width:200px;">
        <button class="btn small" id="addSchoolBtn">Add Station</button>
        <button class="btn ghost small" id="saveSchoolNamesBtn">Save Name Changes</button>
      </div>
    </div>

    <div class="settings-section card">
      <h3>Google Backend Connection</h3>
      <div class="hint" style="margin-bottom:10px;">Connects this app to a Google Sheet (shared live data — including admin/employee accounts), Google Drive (photo uploads), and Gmail (notification emails) through a Google Apps Script Web App you control — no Google Cloud Console setup needed. See the About page for step-by-step setup.</div>
      <div class="fields">
        <div class="field full"><label>Apps Script Web App URL</label><input type="text" id="g_scriptUrl" value="${esc(settings.google.scriptUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></div>
        <div class="field full"><label>Access Key</label><input type="text" id="g_accessKey" value="${esc(settings.google.accessKey)}" placeholder="the same secret key you set inside the script"></div>
      </div>
      <div class="actions-row">
        <button class="btn small" id="saveGoogleCfgBtn">Save Connection Settings</button>
        <button class="btn ghost small" id="googleTestBtn">Test Connection</button>
        ${isGoogleConfigured() ? `<button class="btn gold small" id="googleSaveBtn">Save to Backend Now</button><button class="btn ghost small" id="googleLoadBtn">Load from Backend Now</button>` : ''}
      </div>
      <div class="hint" style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line);"><strong>Auto-Save to Backend</strong> — automatically pushes your Personnel, Schools, and Users changes to the shared Sheet about 25 seconds after you stop making edits, so you don't have to remember to click Save to Backend Now yourself. This never touches Pending submissions — those sync in and get removed on their own the moment someone submits, approves, or rejects, so an auto-save can't ever overwrite or lose one. Only turn this on if you're the one primary admin actively working at a given time — if you and another admin are both making changes on different devices around the same time, whoever's auto-save fires last will still silently overwrite the other's Personnel/Schools/Users changes, same as a manual save would.</div>
      <label style="display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13px;"><input type="checkbox" id="autoSaveToggle" ${settings.autoSaveToBackend?'checked':''}> Enable Auto-Save to Backend</label>
    </div>

    <div class="settings-section card">
      <h3>Appearance</h3>
      <div class="fields">
        <div class="field"><label>Background Mode</label><select id="themeMode"><option value="color" ${settings.theme.mode==='color'?'selected':''}>Color / Hue</option><option value="photo" ${settings.theme.mode==='photo'?'selected':''}>Photo</option></select></div>
        <div class="field"><label>Accent Color</label><input type="color" id="themeColor" value="${settings.theme.color}" style="height:38px;padding:2px;"></div>
        <div class="field"><label>Background Photo</label><input type="file" id="themePhoto" accept="image/*"></div>
      </div>
      <button class="btn small" id="saveThemeBtn" style="margin-top:12px;">Apply Appearance</button>
    </div>

    <div class="settings-section card">
      <h3>This Device & Backups</h3>
      <div class="hint" style="margin-bottom:10px;">This app automatically remembers your data (accounts, personnel, settings) in this browser, on this device, so refreshing or reopening the page brings everything back — you'll still need to log in, but with your existing account, not a new one. This is local to this specific browser/device only; it isn't synced anywhere unless you also connect a Google backend or use Export/Import Backup.</div>
      <div class="hint" style="margin-bottom:10px;">On a shared or public computer, clear this device's saved copy when you're done, so the next person who opens this file doesn't see your school's data.</div>
      <button class="btn danger small" id="clearLocalBtn">Clear Saved Data on This Device</button>
      <div class="hint" style="margin-top:14px;">For portability and true backups (moving to another device, or as a safety net), still use <strong>Export Backup</strong> in the sidebar — ideally encrypted — and store the file somewhere access-controlled.</div>
    </div>
  `;
}

/* ============================================================= ABOUT ============================================================= */
function renderAbout(){
  return `
    <div class="topline"><div><div class="eyebrow">Reference</div><h1>About SANSA 201 Portal</h1></div></div>
    <div class="lane-divider"></div>
    <div class="card">
      <h3>Welcome to SANSA 201 Portal</h3>
      <p class="hint">Welcome to SANSA 201 Portal — a digital companion for school personnel records, originally developed at Sarangani National Sports Academy (SANSA).</p>
      <p class="hint">SANSA 201 Portal is a digital support tool designed to assist School Administrative Officers (SAOs), school personnel, and employees in managing and monitoring personnel-related information more efficiently. It is not intended to replace the official paper-based 201 Personnel File, which remains the school's official personnel record. Instead, SANSA 201 Portal serves as a complementary platform that enables faster access to personnel information, improves record monitoring, and supports more efficient administrative processes.</p>
      <p class="hint">One of its key features is the Step Increment and Loyalty Award Notification System, which automatically alerts School Administrative Officers when employees are approaching eligibility for these benefits — helping ensure supporting documents are prepared and processed promptly, and minimizing missed opportunities.</p>
      <p class="hint">Employees and new hires aren't limited to just viewing their information. SANSA 201 Portal also lets them submit their own details and request corrections to their records directly — with every submission reviewed and confirmed by the app administrator before it becomes official. This reduces repetitive manual encoding and gives employees a more active role in keeping their own records accurate.</p>
      <p class="hint">The system also includes a Quick Links section, consolidating commonly used DepEd websites, online systems, forms, and other official resources in one convenient place.</p>
      <p class="hint">SANSA 201 Portal reflects a continuing effort to bring practical digital innovation into everyday school administration — improving service delivery and supporting informed decision-making, while remaining fully aligned with existing DepEd records management policies.</p>
      <p class="hint">Thank you for using SANSA 201 Portal. We hope this platform becomes a reliable partner in your daily work — making personnel information easier to access, important milestones easier to monitor, and essential resources readily available whenever you need them.</p>
      <p class="hint" style="font-style:italic;">Together, let us make personnel information more accessible, administrative services more proactive, and public service more efficient.</p>
      <p class="hint" style="margin-top:16px; padding-top:14px; border-top:1px solid var(--line);">This application was independently conceptualized and developed by <strong>Ralf Jayvene C. Alaba</strong>, Administrative Officer, Sarangani National Sports Academy, Schools Division of Sarangani, Department of Education — using web technologies, Google Apps Script, Google Workspace services, and AI-assisted development tools for coding assistance. All system planning, workflow design, and feature decisions were personally directed by the developer.</p>
      <p class="hint">For questions, feedback, or support: <a href="mailto:ralfjayvene.alaba@deped.gov.ph" style="color:var(--court); font-weight:600;">ralfjayvene.alaba@deped.gov.ph</a></p>
      <p class="hint" style="margin-top:10px; font-style:italic;">"The best systems are not always the most complex — they are the ones that solve real problems. I built this application from the perspective of someone who performs these tasks every day, hoping it continues to evolve into a practical digital solution that can benefit not only SANSA but other schools and offices seeking efficient, accessible, and sustainable personnel management."</p>
      <p class="hint" style="text-align:right; margin-top:4px;">— Ralf Jayvene C. Alaba</p>
    </div>
    <div class="card" style="margin-top:14px;">
      <h3>What's automated</h3>
      <p class="hint"><strong>Step Increment:</strong> starts at Step 1 and moves 1 step higher every ${settings.stepIncrementYears} years for as long as an employee is not promoted — only the ${settings.stepIncrementYears}-year counting restarts each time; the step number itself keeps climbing (Step 1 → 2 → 3, and so on, up to Step ${STEP_MAX}). The <em>only</em> thing that resets the step number back to 1 is an actual promotion — indicated by entering a new <strong>Date of Last Promotion</strong> — at which point the ${settings.stepIncrementYears}-year counting also restarts from that promotion date. Nothing happens automatically without confirmation: the app proposes the change, and an admin must click <strong>Confirm Step Increment</strong> before it takes effect.<br><br>
      <strong>Loyalty Award:</strong> first triggers ${settings.loyaltyFirstYears} years after the Original Appointment Date (₱10,000), then every ${settings.loyaltyIntervalYears} years after that (₱5,000 each time).<br><br>
      <strong>201 Documents:</strong> admins and employees can both upload a scanned 201 file as a single PDF, kept as a running history of every version uploaded over time. Only admins can view or open these files — an employee's own profile shows only whether something is on file and when it was last updated.<br><br>

function allFieldOptionsForMapping(){
  return Object.values(FIELD_GROUPS).flat().filter(([k])=>k!=='photo');
}
function guessFieldForHeader(header){
  const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const h = norm(header);
  const all = allFieldOptionsForMapping();
  let best = null;
  all.forEach(([k,label])=>{
    const nk = norm(k), nl = norm(label);
    if(nk===h || nl===h){ best = k; return; }
    if(!best && (nl.includes(h) || h.includes(nl)) && h.length>2){ best = k; }
  });
  return best;
}

        </div>

      </div>

    const dupCount = preview.filter(r=>r.dup).length;
    return `
      <div class="topline"><div><div class="eyebrow">Personnel Actions</div><h1>Import from CSV — Preview</h1></div></div>
      <div class="lane-divider"></div>

        <tbody>${preview.map((r,i)=>`<tr>${r.dup?'style="background:#FDECEA;"':''}<td>${i+1}</td><td>${esc(r.fn)}</td><td>${esc(r.ln)}</td><td>${r.dup?`⚠ Possible duplicate of ${esc(fullName(r.dup))}`:'✓ New record'}</td></tr>`).join('')}</tbody></table>
        <div class="actions-row" style="margin-top:14px;">
          <button class="btn" id="csvConfirmImportBtn">Import ${ci.rows.length - dupCount} New Record${(ci.rows.length-dupCount)===1?'':'s'}${dupCount?` (skip ${dupCount} flagged)`:''}</button>
          <button class="btn ghost" id="csvBackToMappingBtn">Back</button>
        </div>
      </div>
    `;
  }
}

function bindDynamicEvents(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click', ev=>{
    ev.preventDefault(); state.view=el.dataset.nav; render();
    if(el.dataset.nav==='newhire') refreshMyAccountLink(false);
  }));
  app.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>{ state.activeProfileId=el.dataset.open; state.view='profile'; state.profileTab='personal'; render(); }));

  app.querySelectorAll('[data-open-link]').forEach(el=>el.addEventListener('click', ()=>{
    const l = quickLinks.find(x=>x.id===el.dataset.openLink); if(l) window.open(l.url, '_blank');
  }));
  app.querySelectorAll('[data-delete-link]').forEach(el=>el.addEventListener('click', ()=>{
    showConfirm('Remove this link?', ()=>{ quickLinks = quickLinks.filter(x=>x.id!==el.dataset.deleteLink); logActivity('Removed a Quick Link'); render(); toast('Link removed'); });
  }));
  const addQuickLinkBtn = document.getElementById('addQuickLinkBtn');
  if(addQuickLinkBtn) addQuickLinkBtn.addEventListener('click', ()=>{
    const label = document.getElementById('qlLabel').value.trim(), url = document.getElementById('qlUrl').value.trim();
    if(!label || !url){ showAlert('Please provide both a label and a URL.'); return; }
    if(!/^https?:\/\//i.test(url)){ showAlert('Please enter a full URL starting with https://'); return; }
    quickLinks.push({ id:uid(), label, url });
    logActivity(`Added Quick Link: ${label}`);
    render(); toast('Link added');
  });

  const searchInput = document.getElementById('searchInput');
  if(searchInput) searchInput.addEventListener('input', ()=>{ state.search=searchInput.value; render(); const el=document.getElementById('searchInput'); if(el){el.focus(); el.selectionStart=el.selectionEnd=el.value.length;} });
  const statusFilter = document.getElementById('statusFilter');
  if(statusFilter) statusFilter.addEventListener('change', ()=>{ state.statusFilter=statusFilter.value; render(); });
  const sortOrderSelect = document.getElementById('sortOrderSelect');
  if(sortOrderSelect) sortOrderSelect.addEventListener('change', ()=>{ settings.sortOrder=sortOrderSelect.value; render(); });
  const nameOrderSelect = document.getElementById('nameOrderSelect');
  if(nameOrderSelect) nameOrderSelect.addEventListener('change', ()=>{ settings.nameDisplayOrder=nameOrderSelect.value; render(); });

  const saveListBtn = document.getElementById('saveListBtn');
  if(saveListBtn) saveListBtn.addEventListener('click', ()=>{
    let changed = 0;
    app.querySelectorAll('[data-list-row]').forEach(row=>{
      const p = findPerson(row.dataset.listRow); if(!p) return;
      let rowChanged = false;
      row.querySelectorAll('[data-list-field]').forEach(inp=>{ if(p[inp.dataset.listField] !== inp.value){ rowChanged = true; } });
      if(rowChanged){
        snapshot(p, 'Before bulk list edit');
        row.querySelectorAll('[data-list-field]').forEach(inp=>{ p[inp.dataset.listField] = inp.value; });
        changed++;
      }
    });
    if(changed) logActivity(`Bulk-updated ${changed} record(s) via Personnel List`);
    render(); toast(changed ? `Saved changes to ${changed} record(s)` : 'No changes to save');
  });

  const printListBtn = document.getElementById('printListBtn');
  if(printListBtn) printListBtn.addEventListener('click', ()=>{ setPrintOrientation(settings.printOrientation || 'landscape'); window.print(); });
  const printOrientationSelect = document.getElementById('printOrientationSelect');
  if(printOrientationSelect) printOrientationSelect.addEventListener('change', ()=>{ settings.printOrientation = printOrientationSelect.value; });
  app.querySelectorAll('[data-add-col]').forEach(btn=>btn.addEventListener('click', ()=>{
    settings.exportColumns = settings.exportColumns || [...DEFAULT_EXPORT_COLUMNS];
    if(!settings.exportColumns.includes(btn.dataset.addCol)) settings.exportColumns.push(btn.dataset.addCol);
    render();
  }));
  app.querySelectorAll('[data-remove-col]').forEach(btn=>btn.addEventListener('click', ()=>{
    settings.exportColumns.splice(parseInt(btn.dataset.removeCol),1); render();
  }));
  app.querySelectorAll('[data-move-col-up]').forEach(btn=>btn.addEventListener('click', ()=>{
    const i = parseInt(btn.dataset.moveColUp); if(i<=0) return;
    [settings.exportColumns[i-1], settings.exportColumns[i]] = [settings.exportColumns[i], settings.exportColumns[i-1]]; render();
  }));
  app.querySelectorAll('[data-move-col-down]').forEach(btn=>btn.addEventListener('click', ()=>{
    const i = parseInt(btn.dataset.moveColDown); if(i>=settings.exportColumns.length-1) return;
    [settings.exportColumns[i], settings.exportColumns[i+1]] = [settings.exportColumns[i+1], settings.exportColumns[i]]; render();
  }));
  const resetExportColsBtn = document.getElementById('resetExportColsBtn');
  if(resetExportColsBtn) resetExportColsBtn.addEventListener('click', ()=>{ settings.exportColumns = [...DEFAULT_EXPORT_COLUMNS]; render(); toast('Reset to default columns'); });
  const downloadCsvCustomBtn = document.getElementById('downloadCsvCustomBtn');
  if(downloadCsvCustomBtn) downloadCsvCustomBtn.addEventListener('click', ()=>{
    const list = filteredPersonnel();
    const cols = settings.exportColumns.map(key=>EXPORT_COLUMN_DEFS.find(d=>d.key===key)).filter(Boolean);
    if(!cols.length){ showAlert('Select at least one column first.'); return; }
    const rows = [cols.map(c=>c.label), ...list.map(p=>cols.map(c=>c.getValue(p)))];
    const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
    const schoolName = schools.find(s=>s.id===currentSchoolId)?.name || 'School';
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${schoolName.replace(/[^a-z0-9]+/gi,'_')}_Personnel_Roster_${exportDateStamp()}.csv`; a.click();
    logActivity(`Exported ${list.length} personnel record(s) to CSV (${cols.length} column(s))`);
    toast('CSV file downloaded');
  });
  const downloadJsonCustomBtn = document.getElementById('downloadJsonCustomBtn');
  if(downloadJsonCustomBtn) downloadJsonCustomBtn.addEventListener('click', ()=>{
    const list = filteredPersonnel();
    const cols = settings.exportColumns.map(key=>EXPORT_COLUMN_DEFS.find(d=>d.key===key)).filter(Boolean);
    if(!cols.length){ showAlert('Select at least one column first.'); return; }
    const rows = list.map(p=>{ const row={}; cols.forEach(c=>{ row[c.label]=c.getValue(p); }); return row; });

    const val=id=>{ const el=document.getElementById(id); return el?el.value.trim():''; };
    const lastName=val('nh_lastName'), firstName=val('nh_firstName');
    if(!lastName||!firstName){ showAlert('Last name and first name are required.'); return; }
    // Compute this fresh from live data right now, rather than trusting the button's data-mode
    // attribute — that value depends on exactly which render produced the button currently on
    // screen, which introduced a timing dependency on background refreshes. This is direct and
    // can't go stale or come back blank.
    const freshLinkedPerson = session.user?.linkedPersonId ? personnel.find(p=>p._uid===session.user.linkedPersonId) : null;
    const mode = freshLinkedPerson ? 'update' : 'new';
    // Permanent diagnostic snapshot, captured at the exact moment of clicking Submit — not just
    // when the page was rendered. This travels with the submission itself, so if the tag is ever
    // wrong again, the actual cause is visible right on the card with no need for console
    // commands, screenshots, or debug panels to figure out what happened after the fact.
    const debugLinkedId = session.user?.linkedPersonId || '';
    const debugRecordFound = !!(debugLinkedId && personnel.find(p=>p._uid===debugLinkedId));
    let sub = pending.find(x=>x.schoolId===currentSchoolId && x.submittedByUsername===session.user?.username && (!x.status || x.status==='Pending'));
    if(!sub){ sub = { _uid: uid(), schoolId: currentSchoolId, submittedByUsername: session.user?.username||'' }; pending.push(sub); }
    sub.status = 'Pending'; sub.rejectionReason = '';
    sub.submittedAt = new Date().toISOString();
    sub.kind = mode;
    sub._debugLinkedId = debugLinkedId;
    sub._debugRecordFound = debugRecordFound;
    sub.targetPersonId = mode==='update' ? session.user.linkedPersonId : null;
    Object.values(NEWHIRE_FIELDS).flat().forEach(([k])=>{ sub[k]=val('nh_'+k); });
    const file201Input = document.getElementById('nh_file201Input');
    if(mode==='new' && file201Input && file201Input.files[0]){
      const label = val('nh_file201Label');
      const file = file201Input.files[0];
      if(file.type !== 'application/pdf'){ showAlert('Only PDF files are accepted for 201 documents.'); return; }
      if(file.size > 10*1024*1024){ showAlert('This file is larger than 10MB. Please compress the PDF first, then try submitting again.'); return; }
      if(isGoogleConfigured()){
        try{
          const b64 = await new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result.split(',')[1]); r.onerror=reject; r.readAsDataURL(file); });
          const res = await appsScriptCall('uploadPersonDocument', { filename: file.name, base64: b64, personId: sub._uid, personName: `${firstName} ${lastName}` });
          if(res.url) sub._newFile201 = { url: res.url, label: label||'', uploadedAt: new Date().toISOString(), filename: file.name, uploadedBy: `${firstName} ${lastName}` };
        }catch(e){ console.log('201 document upload failed at submission time: '+e.message); }
      }
    }
    logActivity(mode==='update' ? `Update request from ${firstName} ${lastName}` : `New hire submission from ${firstName} ${lastName}`);
    // Employees have no access to Save to Backend Now, so without this, their submission would
    // only ever exist on their own device and never actually reach the admin. This safely adds/
    // updates just this one row in the shared Pending sheet, without touching anything else.
    let backendSyncFailed = false, backendSyncError = '';
    if(isGoogleConfigured()){
      try{
        sub.status = sub.status || 'Pending';
        const row = PENDING_COLS.map(c=>sub[c] ?? '');
        await appsScriptCall('upsertPending', { header: PENDING_COLS, row });
        sub._syncConfirmed = true;
      }catch(e){ backendSyncFailed = true; backendSyncError = e.message; sub._syncConfirmed = false; }
    } else { sub._syncConfirmed = false; }
    if(settings.notifyEmail.enabled && isGoogleConfigured()){
      try{ const appN = schools.find(s=>s.id===currentSchoolId)?.name || 'SANSA 201 Portal'; await gmailSend(appN+': '+(mode==='update'?'Update request':'New hire submission'), `${firstName} ${lastName} submitted ${mode==='update'?'an update request':'their New Hire Information Sheet'} and it is awaiting your review.`); }catch(e){}
    }
    state.view = mode==='update' ? 'myprofile' : 'dashboard';
    render();
    if(backendSyncFailed){
      showAlert(`Your submission was saved on this device, but couldn't be sent to your school's shared system yet:\n\n${backendSyncError}\n\nThis usually means the app isn't connected properly, or needs a moment — please let your admin know so they can check the connection, and try submitting again shortly. Don't worry, nothing you entered was lost.`);
    } else {

      const targetId = inp.dataset.embedPhotoTarget;
      try{
        const dataUrl = await resizeImageFile(file, 320, 'image/jpeg', 0.75, 42000);
        const target = document.getElementById(targetId);
        if(target){ target.value = dataUrl; toast('Photo attached'); }
      }catch(e){ showAlert('Could not read that image file: ' + e.message); }
    });
  });

  function resizeImageFile(file, maxW, mimeType, quality, maxChars){
    mimeType = mimeType || 'image/jpeg'; quality = quality ?? 0.75;
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ev=>{
        const img = new Image();
        img.onload = ()=>{
          function render(w, q){
            const canvas = document.createElement('canvas');
            const scale = Math.min(1, w/img.width);
            canvas.width = Math.max(1, img.width*scale); canvas.height = Math.max(1, img.height*scale);
            const ctx = canvas.getContext('2d');
            if(mimeType==='image/jpeg'){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
            ctx.drawImage(img,0,0,canvas.width,canvas.height);
            return canvas.toDataURL(mimeType, q);
          }
          if(!maxChars){ resolve(render(maxW, quality)); return; }
          // Adaptively shrink width and quality until safely under the target size
          // (Google Sheets caps a single cell at 50,000 characters).
          let w = maxW, q = quality, out = render(w, q), tries = 0;
          while(out.length > maxChars && tries < 8){
            if(mimeType==='image/jpeg' && q > 0.35){ q -= 0.15; }
            else { w = Math.round(w*0.8); }
            out = render(w, q);
            tries++;
          }
          if(out.length > maxChars){ reject(new Error('This image is too complex to shrink small enough. Try a simpler/smaller source photo.')); return; }
          resolve(out);
        };
        img.onerror = ()=>reject(new Error('Could not load that image.'));
        img.src = ev.target.result;
      };
      reader.onerror = ()=>reject(new Error('Could not read that file.'));
      reader.readAsDataURL(file);
    });
  }

  const setupAdminBtn = document.getElementById('setupAdminBtn');
  if(setupAdminBtn) setupAdminBtn.addEventListener('click', async ()=>{
    const name=document.getElementById('su_name').value.trim(), uname=document.getElementById('su_user').value.trim(), pass=document.getElementById('su_pass').value, schoolName=document.getElementById('su_school').value.trim();
    const logoFile = document.getElementById('su_logo')?.files[0];
    if(!uname||pass.length<6){ showAlert('Username required and password must be at least 6 characters.'); return; }
    if(users.find(u=>u.username.toLowerCase()===uname.toLowerCase())){ showAlert('That username already exists.'); return; }
    await createUser(uname, pass, 'admin', name||uname);
    session.user = users[users.length-1];
    let targetSchool = null;
    if(schoolName){
      const blank = schools.find(s=>!s.name || !s.name.trim());
      if(blank){ blank.name = schoolName; currentSchoolId = blank.id; targetSchool = blank; }
      else { const s = blankSchool(schoolName); schools.push(s); currentSchoolId = s.id; targetSchool = s; }
    } else {
      targetSchool = schools.find(s=>s.id===currentSchoolId);
    }
    if(logoFile && targetSchool){
      try{ targetSchool.logo = await resizeImageFile(logoFile, 300, 'image/png', 0.85, 42000); }catch(e){ toast('Logo skipped: ' + e.message); }
    }
    logActivity(`Admin account created: ${uname}`);
    state.view='dashboard'; render(); toast('Admin account created — you are now logged in.');
  });

  app.querySelectorAll('.login-tabs button[data-role]').forEach(el=>el.addEventListener('click', ()=>{ state.loginRole = el.dataset.role; render(); }));
  const retrySyncBtn = document.getElementById('retrySyncBtn');
  if(retrySyncBtn) retrySyncBtn.addEventListener('click', attemptAutoSync);
  const loginBtn = document.getElementById('loginBtn');
  if(loginBtn) loginBtn.addEventListener('click', async ()=>{
    if(syncStatus==='syncing'){ toast('Still checking the shared backend — please wait a moment and try again.'); return; }
    const uname=document.getElementById('li_user').value.trim(), pass=document.getElementById('li_pass').value;
    const u = await verifyLogin(uname, pass, state.loginRole);
    if(!u){ toast('Incorrect username or password'); return; }
    session.user = u; logActivity(`${u.role} logged in: ${u.username}`);
    pingDeveloperTracker();
    // Check for a fresher linked-account status right now, before deciding which page to land
    // on — otherwise an employee whose account was linked after this device last synced would
    // get routed straight to the New Hire form (bypassing any nav click, and the refresh tied to
    // it) and get stuck there even though they're actually linked.
    await refreshMyAccountLink();
    const linkedNow = session.user.linkedPersonId && findPerson(session.user.linkedPersonId);
    state.view = session.user.role==='admin' ? 'dashboard' : (linkedNow ? 'myprofile' : 'newhire');
    render(); toast('Welcome, ' + session.user.displayName);
  });
}

/* ============================================================= TOP-LEVEL CONTROLS ============================================================= */
document.getElementById('schoolSwitcher').addEventListener('change', e=>{ currentSchoolId = e.target.value; state.view='dashboard'; render(); toast('Switched station'); });

function serializeAll(){
  return JSON.stringify({ schools, currentSchoolId, personnel, pending, users, activityLog, settings, quickLinks, exportedAt: new Date().toISOString(), app:'SANSA-201' }, null, 2);
}
function loadAll(data){
  schools = data.schools || [blankSchool('')];
  currentSchoolId = data.currentSchoolId || schools[0].id;
  personnel = data.personnel || [];
  pending = data.pending || [];
  users = data.users || [];
  activityLog = data.activityLog || [];
  settings = Object.assign(settings, data.settings || {});
  quickLinks = data.quickLinks || defaultQuickLinks();
  session.user = null;
  applyTheme();
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const doExport = async (wantEncrypt)=>{
    const raw = serializeAll();
    let blob, filename;
    if(wantEncrypt){
      const pass = prompt('Enter a passphrase to encrypt this backup (you will need it to restore):');
      if(!pass){ toast('Export cancelled'); return; }
      const encStr = await encryptText(raw, pass);
      blob = new Blob([encStr], {type:'application/json'}); filename = 'sansa-201-backup-encrypted.json';
    } else { blob = new Blob([raw], {type:'application/json'}); filename = 'sansa-201-backup.json'; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    settings.lastBackupAt = new Date().toISOString();
    render();
    toast('Backup exported');
  };
  showConfirm('Encrypt this backup with a passphrase?', ()=>doExport(true), 'info', { confirmLabel:'Encrypt', cancelLabel:'Plain JSON', onCancel:()=>doExport(false) });
});
document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async evt=>{
    const text = evt.target.result;
    try{
      let obj;
      try{ obj = JSON.parse(text); }catch(_){ obj = null; }
      if(obj && obj.enc){
        const pass = prompt('This backup is encrypted. Enter the passphrase:');
        if(!pass){ toast('Import cancelled'); return; }
        const decStr = await decryptText(text, pass);
        obj = JSON.parse(decStr);
      }
      if(!obj || !obj.app){ throw new Error('bad format'); }
      loadAll(obj); state.view = users.length? 'dashboard' : 'signup'; render(); toast('Backup restored — please log in.');
    }catch(err){ showAlert('Could not read that file. Check the file and passphrase (if encrypted) and try again.'); }
  };
  reader.readAsText(file);
  e.target.value='';
});

function updateSidebarClock(){
  const el = document.getElementById('sidebarClock');
  if(!el) return;
  const now = new Date();
  const timeStr = now.toLocaleTimeString('en-PH', { hour:'numeric', minute:'2-digit', hour12:true, timeZone:'Asia/Manila' });
  const dateStr = now.toLocaleDateString('en-PH', { month:'short', day:'numeric', timeZone:'Asia/Manila' });
  el.title = now.toLocaleString('en-PH', { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'numeric', minute:'2-digit', second:'2-digit', hour12:true, timeZone:'Asia/Manila' }) + ' PHT';
  el.textContent = `${dateStr}, ${timeStr}`;
}
updateSidebarClock();
setInterval(updateSidebarClock, 1000);
init();
</script>
