<style>
:root{
  --ink:#10221F; --paper:#F6F3EC; --panel:#FFFFFF;
  --court:#0B4F4A; --court-dark:#082F2C; --lane:#E4572E; --gold:#C9A227;
  --line:#DAD3C0; --muted:#6B7770; --danger:#B23A2E; --radius:10px;
  --bgphoto:none;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); background-image:var(--bgphoto); background-size:cover; background-position:center; background-attachment:fixed;
  color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
}
body.has-photo-bg .shell{ background:rgba(246,243,236,.88); backdrop-filter:blur(1px); }
h1,h2,h3,.display{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.02em;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;} button{font-family:'Inter',sans-serif; cursor:pointer;}
.shell{display:flex; min-height:100vh;}
.sidebar{width:250px; flex-shrink:0; background:var(--court); color:#EFEAE0; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:hidden;}
.brand{padding:18px 18px 14px; border-bottom:1px solid rgba(255,255,255,.14); flex-shrink:0;}
.brand .mark{display:flex; align-items:center; gap:10px;}
.brand .badge{width:32px; height:32px; border-radius:50%; background:var(--gold); color:var(--court-dark); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; flex-shrink:0;}
.brand .name{font-family:'Oswald',sans-serif; font-size:14px; font-weight:600; letter-spacing:.02em; line-height:1.28;}
.brand .sub{font-size:9px; color:#B9CFCB; letter-spacing:normal; margin-top:3px; line-height:1.4;}
.status-panel{flex-shrink:0; border-bottom:1px solid rgba(255,255,255,.14);}
.school-switch{padding:11px 16px 8px;}
.school-switch select{width:100%; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); color:#fff; border-radius:7px; padding:7px 9px; font-size:12px;}
.school-switch select option{color:#111;}
.session-badge{padding:2px 16px 10px; font-size:12.5px; color:#EFEAE0; display:flex; align-items:center; justify-content:space-between; gap:6px;}
.session-badge .who{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.session-badge .role{font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:#8FADA8;}
.status-subrow{padding:0 16px 11px; font-size:10.5px; color:#8FADA8; display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap; row-gap:4px;}
.status-subrow #googleStatus{white-space:nowrap;}
.status-subrow #sidebarClock{white-space:nowrap; font-variant-numeric:tabular-nums; text-align:right;}
.music-toggle-btn{background:none; border:1px solid rgba(255,255,255,.25); border-radius:6px; color:#EFEAE0; font-size:11px; padding:2px 6px; cursor:pointer; flex-shrink:0;}
.music-toggle-btn:hover{background:rgba(255,255,255,.1);}
.music-toggle-btn.hidden-no-music{display:none;}
.nav{padding:12px 12px; flex:1; overflow-y:auto; min-height:0;}
.nav button{width:100%; display:flex; align-items:center; gap:10px; background:none; border:none; color:#DCEAE7; padding:10px 12px; border-radius:8px; font-size:13px; font-weight:500; margin-bottom:3px; text-align:left; position:relative;}
.nav button svg{width:16px; height:16px; opacity:.85; flex-shrink:0;}
.nav button:hover{background:rgba(255,255,255,.08);}
.nav button.active{background:rgba(255,255,255,.16); color:#fff;}
.nav .navlabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.12em; color:#8FADA8; margin:14px 12px 6px;}
.navbadge{margin-left:auto; background:var(--lane); color:#fff; font-size:10px; font-weight:700; border-radius:20px; padding:1px 7px;}
.nav-chevron{margin-left:auto; opacity:.6; width:13px; height:13px; flex-shrink:0;}
.nav-popup{position:fixed; display:none; background:#fff; border-radius:10px; box-shadow:0 10px 32px rgba(0,0,0,.28); padding:6px; z-index:9000; min-width:216px;}
.nav-popup button{width:100%; display:flex; align-items:center; gap:10px; background:none; border:none; color:var(--ink); padding:10px 12px; border-radius:7px; font-size:13px; font-weight:500; text-align:left; margin-bottom:0;}
.nav-popup button:hover{background:#F0F4F2;}
.nav-popup button svg{width:16px; height:16px; opacity:.7; flex-shrink:0; color:var(--court);}
.sidebar-foot{padding:12px 12px 14px; border-top:1px solid rgba(255,255,255,.14); flex-shrink:0;}
.sidebar-foot button{width:100%; display:flex; align-items:center; gap:8px; justify-content:center; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); color:#EFEAE0; padding:8px 10px; border-radius:7px; font-size:11.5px; margin-bottom:7px;}
.sidebar-foot button:hover{background:rgba(255,255,255,.14);}
.sidebar-foot input[type=file]{display:none;}
.copyright{font-size:9.5px; color:#8FADA8; text-align:center; padding:8px 6px 0; line-height:1.5;}
.sidebar-copyright{font-size:9.5px; color:#8FADA8; line-height:1.5; text-align:center; padding:12px 14px 4px; border-top:1px solid rgba(255,255,255,.14); flex-shrink:0;}
.main{flex:1; min-width:0; padding:26px 32px 20px; display:flex; flex-direction:column;}
.main-inner{flex:1;}
.topline{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
.topline h1{font-size:24px; margin:0; color:var(--court-dark);}
.topline .eyebrow{font-size:10.5px; letter-spacing:.13em; color:var(--muted); text-transform:uppercase; margin-bottom:2px;}
.lane-divider{height:6px; border-radius:4px; margin:16px 0 20px; background:repeating-linear-gradient(115deg, var(--lane) 0 14px, var(--gold) 14px 22px, transparent 22px 34px); opacity:.85;}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:13px; margin-bottom:22px;}
.tile{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:15px 17px; position:relative; overflow:hidden;}
.tile .tnum{font-family:'Oswald',sans-serif; font-size:32px; font-weight:600; line-height:1; color:var(--court-dark);}
.tile .tlabel{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; margin-top:6px;}
.tile.accent .tnum{color:var(--lane);}
.tile .tstripe{position:absolute; top:0; left:0; width:5px; height:100%; background:var(--court);}
.tile.accent .tstripe{background:var(--lane);} .tile.gold .tstripe{background:var(--gold);}
.grid2{display:grid; grid-template-columns:1.3fr 1fr; gap:15px;}
@media(max-width:980px){.grid2{grid-template-columns:1fr;}}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:19px;}
.card h3{font-size:13.5px; margin:0 0 13px; color:var(--court-dark); letter-spacing:.03em;}
.barrow{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;}
.barrow .blabel{width:130px; flex-shrink:0; font-weight:500;}
.barrow .btrack{flex:1; height:9px; background:#EDE8DA; border-radius:5px; overflow:hidden;}
.barrow .bfill{height:100%; background:var(--court); border-radius:5px;}
.barrow .bfill.orange{background:var(--lane);}
.barrow .bval{width:24px; text-align:right; color:var(--muted); flex-shrink:0;}
.roster-mini{list-style:none; margin:0; padding:0;}
.roster-mini li{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
.roster-mini li:last-child{border-bottom:none;}
.roster-mini img,.ph-fallback{width:32px; height:32px; border-radius:50%; object-fit:cover; background:var(--court); color:#fff; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:600; flex-shrink:0;}
.roster-mini .rm-name{font-size:12.5px; font-weight:600;}
.roster-mini .rm-sub{font-size:11px; color:var(--muted);}
.toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.searchbox{flex:1; min-width:220px; display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 13px;}
.searchbox svg{width:16px; height:16px; color:var(--muted); flex-shrink:0;}
.searchbox input{border:none; outline:none; background:none; font-size:13px; width:100%; font-family:'Inter',sans-serif;}
select, .toolbar input[type=text]{border:1px solid var(--line); border-radius:8px; padding:9px 12px; background:var(--panel); font-size:12.5px; color:var(--ink); font-family:'Inter',sans-serif;}
.btn{border:none; border-radius:8px; padding:9px 15px; font-size:12.5px; font-weight:600; background:var(--court); color:#fff; display:inline-flex; align-items:center; gap:6px;}
.btn:hover{background:var(--court-dark);}
.btn.lane{background:var(--lane);} .btn.lane:hover{background:#c4471f;}
.btn.gold{background:var(--gold); color:#3a2f04;}
.btn.ghost{background:none; border:1px solid var(--line); color:var(--ink);} .btn.ghost:hover{background:#EFEAE0;}
.btn.danger{background:none; color:var(--danger); border:1px solid #E3B7AF;}
.btn.small{padding:6px 11px; font-size:11.5px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.roster-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:13px;}
.roster-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:15px; display:flex; gap:12px; align-items:flex-start; cursor:pointer;}
.roster-card:hover{border-color:var(--court); box-shadow:0 3px 14px rgba(11,79,74,.10);}
.roster-card .photo,.ph-fallback-lg{width:54px; height:54px; border-radius:9px; object-fit:cover; flex-shrink:0; background:var(--court); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-family:'Oswald',sans-serif; font-size:15px;}
.rc-body{min-width:0; flex:1;}
.rc-name{font-weight:700; font-size:14px; line-height:1.25;}
.rc-role{font-size:11.5px; color:var(--muted); margin-top:1px;}
.rc-meta{display:flex; align-items:center; gap:7px; margin-top:7px; flex-wrap:wrap;}
.bib{font-family:'JetBrains Mono',monospace; font-size:10px; background:var(--court); color:#fff; padding:2px 8px; border-radius:20px;}
.status-pill{font-size:10px; padding:2px 8px; border-radius:20px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
.status-pill.active{background:#E1EFE8; color:var(--court-dark);}
.status-pill.inactive{background:#F3E2DD; color:var(--danger);}
.due-pill{font-size:10px; padding:2px 8px; border-radius:20px; font-weight:700;}
.due-pill.soon{background:#FBEBD6; color:#8A5A12;}
.due-pill.urgent{background:#F7DAD2; color:var(--danger);}
.due-pill.over{background:var(--danger); color:#fff;}
.empty-state{padding:50px 20px; text-align:center; color:var(--muted);}
.empty-state svg{width:40px; height:40px; margin-bottom:10px; opacity:.4;}
.profile-head{display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap;}
.profile-photo,.ph-fallback-xl{width:98px; height:98px; border-radius:12px; object-fit:cover; flex-shrink:0; background:var(--court); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Oswald',sans-serif; font-size:28px; border:3px solid var(--gold);}
.profile-name{font-size:22px; margin:0 0 3px;}
.profile-sub{color:var(--muted); font-size:12.5px; margin-bottom:9px;}
.profile-badges{display:flex; gap:7px; flex-wrap:wrap; align-items:center;}
.tabs{display:flex; gap:3px; border-bottom:2px solid var(--line); margin:20px 0 18px; flex-wrap:wrap;}
.tabs{display:flex; gap:4px; margin:20px 0 0; flex-wrap:wrap; align-items:flex-end;}
.tabbtn{background:var(--court); border:1px solid var(--court); border-bottom:2px solid var(--line); border-radius:8px 8px 0 0; padding:9px 14px; font-size:10.5px; font-weight:600; color:#CFE3DF; text-transform:uppercase; letter-spacing:.03em; cursor:pointer; transition:background .15s ease, color .15s ease;}
.tabbtn:hover{background:var(--court-dark); color:#FFFFFF;}
.tabbtn.active{background:var(--panel); color:var(--court-dark); border-color:var(--line); border-bottom:2px solid var(--panel); position:relative; margin-bottom:-2px; padding-bottom:10px;}
.fields{display:grid; grid-template-columns:repeat(auto-fill,minmax(225px,1fr)); gap:15px 20px;}
.field label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:4px;}
.field .val{font-size:13px; font-weight:500; min-height:18px;}
.field input,.field select,.field textarea{width:100%; border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:13px; font-family:'Inter',sans-serif; background:#fff;}
.field textarea{resize:vertical; min-height:44px;}
.field.full{grid-column:1/-1;}
.photo-row{display:flex; gap:6px; align-items:center;}
.eye-btn{flex-shrink:0; background:#EFEAE0; border:1px solid var(--line); border-radius:7px; padding:8px 9px; font-size:11px;}
.ssl-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
.ssl-table th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:8px 9px; border-bottom:1px solid var(--line);}
.ssl-table td{padding:8px 9px; border-bottom:1px solid var(--line);}
.ssl-table tr:last-child td{border-bottom:none;}
.actions-row{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; align-items:center;}
.backlink{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--court); font-weight:600; margin-bottom:12px; background:none; border:none;}
.backlink svg{width:14px; height:14px;}
.section-title{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--court-dark); font-weight:700; margin:20px 0 11px; display:flex; align-items:center; gap:8px;}
.section-title::after{content:''; flex:1; height:1px; background:var(--line);}
.form-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px; max-width:960px;}
.toast{position:fixed; bottom:20px; right:20px; background:var(--court-dark); color:#fff; padding:11px 17px; border-radius:8px; font-size:12.5px; box-shadow:0 6px 20px rgba(0,0,0,.2); z-index:60; display:flex; align-items:center; gap:8px; animation:toastin .2s ease;}
@keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.app-modal-overlay{position:fixed; inset:0; background:rgba(8,20,18,.55); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; animation:modalfade .15s ease;}
@keyframes modalfade{from{opacity:0;} to{opacity:1;}}
.app-modal{background:#fff; border-radius:14px; max-width:440px; width:100%; box-shadow:0 24px 60px rgba(0,0,0,.35); overflow:hidden; animation:modalpop .18s ease;}
@keyframes modalpop{from{opacity:0; transform:scale(.96) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);}}
.app-modal-bar{height:5px; background:linear-gradient(90deg, var(--court), var(--gold), var(--lane));}
.app-modal-body{padding:22px 24px 20px;}
.app-modal-icon{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:12px;}
.app-modal-icon.info{background:#E3F0EE; color:var(--court);}
.app-modal-icon.warn{background:#FBEBD6; color:#8A5A12;}
.app-modal-icon.danger{background:#F7DAD2; color:var(--danger);}
.app-modal-msg{font-size:13.5px; line-height:1.6; color:var(--ink); white-space:pre-line;}
.app-modal-download-link{display:block; text-align:center; margin-top:14px; background:var(--court); color:#fff; font-weight:700; font-size:13.5px; padding:12px 16px; border-radius:9px; text-decoration:none;}
.app-modal-download-link:hover{background:var(--court-dark);}
.app-modal-actions{display:flex; gap:10px; justify-content:flex-end; padding:14px 24px 20px;}
.app-modal-actions button{padding:9px 18px; border-radius:8px; font-size:13px; font-weight:600; border:none;}
.app-modal-actions .app-modal-ok{background:var(--court); color:#fff;}
.app-modal-actions .app-modal-ok:hover{background:var(--court-dark);}
.app-modal-actions .app-modal-cancel{background:#F0F0EC; color:var(--ink);}
.app-modal-actions .app-modal-cancel:hover{background:#E4E4DE;}
.hint{font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.5;}
.notice{background:#FBF1DD; border:1px solid #EAD9A8; border-radius:8px; padding:11px 14px; font-size:12px; color:#6B5410; margin-bottom:18px; line-height:1.55;}
.privacy-consent-card{background:#F0F6F5; border:1.5px solid var(--court); border-radius:10px; padding:16px 18px; margin-bottom:18px;}
.privacy-consent-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; color:var(--court); margin-bottom:8px; text-transform:uppercase; letter-spacing:.02em;}
.privacy-consent-body{font-size:11.5px; color:var(--ink); line-height:1.6; margin-bottom:12px;}
.privacy-consent-check{display:flex; align-items:flex-start; gap:9px; font-size:12.5px; font-weight:600; color:var(--court-dark); cursor:pointer; line-height:1.5;}
.privacy-consent-check input{margin-top:3px; flex-shrink:0; width:16px; height:16px; cursor:pointer;}
.announcement-banner{display:flex; gap:12px; align-items:flex-start; background:linear-gradient(135deg, #FFF7E8, #FDEFD6); border:1.5px solid var(--gold); border-radius:10px; padding:14px 16px; margin-bottom:18px; font-size:13px;}
.announcement-banner .ann-text{font-weight:600; color:#5C4308; line-height:1.5; white-space:pre-line;}
.announcement-banner .ann-meta{font-size:10.5px; color:#8A6D1F; margin-top:5px;}
.license-warning-banner{display:flex; gap:12px; align-items:flex-start; background:#FDECEA; border:1.5px solid var(--danger); border-radius:10px; padding:14px 16px; margin-bottom:18px; font-size:14px;}
.license-warning-banner .lw-title{font-weight:700; color:var(--danger); line-height:1.5;}
.license-warning-banner .lw-sub{font-size:11.5px; color:#8A3A32; margin-top:4px; line-height:1.5;}
.notice.blue{background:#E6EFED; border-color:#B9CFCB; color:var(--court-dark);}
.alert-card{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:9px; padding:14px 16px; display:flex; gap:13px; align-items:center; margin-bottom:11px;}
.alert-card.urgent{border-left-color:var(--danger);}
.alert-card .ac-title{font-weight:700; font-size:13px;}
.alert-card .ac-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
.footer-copy{text-align:center; font-size:11px; color:var(--muted); padding:22px 0 4px; border-top:1px solid var(--line); margin-top:26px;}
.pending-card{background:var(--panel); border:1px solid var(--gold); border-radius:var(--radius); padding:16px; margin-bottom:12px;}
.settings-section{margin-bottom:26px;}
.export-builder{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:720px){ .export-builder{grid-template-columns:1fr;} }
.export-col-title{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; margin-bottom:8px;}
.export-available-list, .export-selected-list{border:1px solid var(--line); border-radius:8px; padding:10px; max-height:280px; overflow-y:auto; background:#FAFAF6;}
.export-group-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin:10px 0 4px; }
.export-group-label:first-child{margin-top:0;}
.export-add-btn{display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:12px; margin-bottom:4px; color:var(--court);}
.export-add-btn:hover{background:#EEF5F3; border-color:var(--court);}
.export-selected-row{display:flex; align-items:center; justify-content:space-between; gap:8px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:6px 9px; margin-bottom:4px;}
.export-selected-label{font-size:12px; font-weight:500;}
.export-selected-actions{display:flex; gap:4px; flex-shrink:0;}
.export-selected-actions button{background:none; border:none; color:var(--muted); font-size:11px; padding:3px 6px; border-radius:4px;}
.export-selected-actions button:hover:not(:disabled){background:#F0F0EC; color:var(--ink);}
.export-selected-actions button:disabled{opacity:.3; cursor:default;}
.activity-row{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
.activity-row:last-child{border-bottom:none;}
.activity-row .at{color:var(--muted); font-size:11px; white-space:nowrap;}
.login-screen{min-height:80vh; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-box{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:0; width:100%; max-width:380px; overflow:hidden; box-shadow:0 12px 40px rgba(8,47,44,.14);}
.login-topbar{height:6px; background:linear-gradient(90deg, var(--court) 0%, var(--gold) 100%);}
.login-inner{padding:32px 30px 30px;}
.login-logo{width:64px; height:64px; border-radius:16px; background:var(--paper); border:1px solid var(--line); margin:0 auto 16px; display:flex; align-items:center; justify-content:center; overflow:hidden;}
.login-logo svg{width:32px; height:32px; color:var(--court);}
.login-logo img{width:100%; height:100%; object-fit:cover;}
.badge img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
.logo-thumb{width:36px; height:36px; border-radius:8px; object-fit:cover; border:1px solid var(--line); flex-shrink:0; background:#fff;}
.logo-thumb-empty{width:36px; height:36px; border-radius:8px; border:1px dashed var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--muted); text-align:center;}
.login-eyebrow{text-align:center; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--court); font-weight:700; margin-bottom:4px;}
.login-title{text-align:center; font-size:20px; margin:0 0 6px; color:var(--court-dark);}
.login-subtitle{text-align:center; font-size:12px; color:var(--muted); margin-bottom:22px; line-height:1.5;}
.login-tabs{display:flex; gap:6px; margin-bottom:18px; background:#EFEAE0; padding:4px; border-radius:9px;}
.login-tabs button{flex:1; background:none; border:none; padding:8px; border-radius:6px; font-size:12px; font-weight:600; color:var(--muted);}
.login-tabs button.active{background:var(--court); color:#fff;}
.login-field{margin-bottom:14px;}
.login-field label{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:6px;}
.login-input-wrap{position:relative; display:flex; align-items:center;}
.login-input-wrap svg{position:absolute; left:12px; width:16px; height:16px; color:var(--muted); pointer-events:none;}
.login-box input{width:100%; border:1px solid var(--line); border-radius:9px; padding:11px 12px 11px 38px; font-size:13px;}
.login-input-wrap .pw-toggle{position:absolute; right:8px; left:auto; background:none; border:none; padding:6px; pointer-events:auto; cursor:pointer;}
.login-switch{text-align:center; font-size:12px; color:var(--muted); margin-top:16px;}
.login-switch a{color:var(--court); font-weight:700; cursor:pointer;}
.diff-row{display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:12px;}
.diff-row .dk{width:150px; color:var(--muted); flex-shrink:0;}
.diff-row .dold{color:var(--danger); text-decoration:line-through; opacity:.7;}
.diff-row .dnew{color:var(--court-dark); font-weight:600;}
.mobile-topbar{display:none;}
.sidebar-backdrop{display:none;}
@media(max-width:760px){
  .mobile-topbar{display:flex; align-items:center; gap:12px; background:var(--court); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:200;}
  .mobile-topbar .hamburger-btn{background:none; border:none; color:#fff; padding:4px; cursor:pointer; display:flex; align-items:center; flex-shrink:0;}
  .mobile-topbar .mt-title{font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sidebar{position:fixed; top:0; left:0; height:100vh; width:270px; max-width:82vw; transform:translateX(-100%); transition:transform .25s ease; z-index:300;}

  .sidebar-backdrop.open{opacity:1; pointer-events:auto;}
  .main{padding:14px;}
}
@media(max-width:480px){
  .main{padding:10px;}

}

.print-header{display:none;}
.print-full{display:none;}
@media print{
  @page{ size: landscape; margin: 10mm; }
  /* Employees cannot print at all, by design — this replaces the entire page with a plain
     message the moment printing is attempted, regardless of how it's triggered (there is no
     print button on employee accounts, but this also blocks Ctrl+P / the browser's own print
     menu, which no button-removal alone could prevent). Admin accounts are entirely unaffected. */
  body.employee-session .shell{ display:none !important; }
  body.employee-session::before{
    content: "Printing is not available for employee accounts. If you need a copy of your own records, please request it from your school's Administrative Officer.";
    display:block; font-size:16px; line-height:1.6; padding:80px 60px; text-align:center; color:#000;
  }
  .sidebar, .mobile-topbar, .toolbar, .lane-divider, .notice, .backlink, .tabs, .actions-row, #app .btn, .status-pill.active, .searchbox, .no-print{display:none !important;}
  body{background:#fff !important;}
  .main{padding:0 !important;}
  .print-header{display:flex !important; align-items:center; gap:14px; padding-bottom:14px; margin-bottom:16px; border-bottom:2px solid #000;}
  .print-header img,.print-header .ph-fallback-lg{width:56px; height:56px; border-radius:8px; object-fit:cover;}
  .print-header h2{margin:0; font-size:18px;}
  .print-header .pmeta{font-size:11px; color:#444;}
  .print-full{display:block !important;}
  #tabContent, .edit-only{display:none !important;}
  .field input, .field select{border:none !important; background:none !important; -webkit-appearance:none; appearance:none; padding:2px 0 !important; color:#000 !important;}
  .card, .form-card{box-shadow:none !important; border:1px solid #ccc !important;}
  /* Plain-text print tables wrap naturally — no scrollbar, no clipped input boxes */
  .print-full table{ width:100% !important; table-layout:auto !important; }
  .print-full .ssl-table{font-size:10px; word-break:break-word;}
  .print-full .ssl-table th, .print-full .ssl-table td{padding:4px 5px !important; white-space:normal !important;}
  tr, td, th{page-break-inside:avoid;}
  /* The app's own on-screen layout forces the whole shell to at least fill the viewport height
     (min-height:100vh) and stretches the main content area to fill it via flex-grow. On screen
     that's fine, but print pagination doesn't have a meaningful "viewport height" the same way —
     this was leaving a large blank gap on page 1 before the actual content, pushing everything
     else onto a second page. Switching to normal block flow for print fixes that. */
  .shell{ min-height:auto !important; display:block !important; }
  .main{ display:block !important; }
  .main-inner{ flex:none !important; }
}

/* ============================================================= CRYPTO / AUTH ============================================================= */
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){ return Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function hashPassword(pass, salt){ return sha256Hex(salt+':'+pass); }
async function createUser(username, password, role, displayName){
  const salt = randomSalt();
  const passHash = await hashPassword(password, salt);
  users.push({ username: username.trim(), salt, passHash, role, displayName: displayName||username, createdAt: new Date().toISOString(), linkedPersonId: null });
}
async function verifyLogin(username, password, role){
  const u = users.find(u=>u.username.toLowerCase()===username.trim().toLowerCase() && u.role===role);
  if(!u) return null;
  const hash = await hashPassword(password, u.salt);
  return hash===u.passHash ? u : null;
}
async function deriveKey(passphrase, saltBytes){
  const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:saltBytes, iterations:150000, hash:'SHA-256'}, keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptText(text, passphrase){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(passphrase, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text));
  return JSON.stringify({ enc:true, salt:Array.from(salt), iv:Array.from(iv), data:Array.from(new Uint8Array(ct)) });
}
async function decryptText(jsonStr, passphrase){
  const payload = JSON.parse(jsonStr);
  const salt = new Uint8Array(payload.salt), iv = new Uint8Array(payload.iv), data = new Uint8Array(payload.data);
  const key = await deriveKey(passphrase, salt);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  return new TextDecoder().decode(pt);
}

/* ============================================================= GOOGLE APPS SCRIPT BACKEND ============================================================= */
const PERSON_COLS = ['_uid','schoolId','sslLog','loyaltyLog','positionHistoryLog','history','file201Uploads','postgraduateLog','lastStepIncrementProcessedDate','lastLoyaltyAwardDate','stepNumber','stepAnchorSnapshot','birthdayAcknowledgedDate','empBdayGreetingSeen','empStepGreetingSeen','empLoyaltyGreetingSeen', ...Object.values(FIELD_GROUPS).flat().map(([k])=>k)];
const USER_COLS = ['username','salt','passHash','role','displayName','createdAt','linkedPersonId'];

function isGoogleConfigured(){ return !!(settings.google.scriptUrl && settings.google.accessKey); }
async function appsScriptCall(action, data){
  if(!isGoogleConfigured()) throw new Error('Backend not configured. Set your Apps Script Web App URL and Access Key in Settings first.');
  const res = await fetch(settings.google.scriptUrl, {
    method:'POST',
    body: JSON.stringify({ key: settings.google.accessKey, action, data })
  });
  const rawText = await res.text();
  let json;
  try{ json = JSON.parse(rawText); }
  catch(e){
    if(/^\s*<(!DOCTYPE|html)/i.test(rawText)){
      throw new Error('The backend didn\'t return the expected data — it sent back a web page instead of a result. This usually means the Web App URL in Settings is incorrect, the Apps Script deployment needs to be updated (Deploy → Manage deployments → New version), or Google is asking for re-authorization. Check Settings → Google Backend Connection and try Test Connection.');
    }
    throw new Error('The backend sent back something unexpected: ' + rawText.slice(0,150));
  }
  if(json.error) throw new Error(json.error);
  return json;
}
function rowsFromPersonnel(){ return [PERSON_COLS, ...personnel.map(p=>PERSON_COLS.map(c=>{ const v=p[c]; return (c==='sslLog'||c==='loyaltyLog'||c==='positionHistoryLog'||c==='history'||c==='file201Uploads'||c==='postgraduateLog') ? JSON.stringify(v||[]) : (v ?? ''); }))]; }
// Parses raw CSV text into an array of row-arrays, correctly handling quoted fields (including
// embedded commas, escaped "" quotes, and newlines inside a quoted field). Returns [] for empty input.
function parseCsvText(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c==='"' && next==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){ /* skip, \n handles the line break */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1 || (r[0]||'').trim()!=='');
}
function personnelFromRows(rows){
  if(!rows || rows.length<2) return [];
  const header = rows[0];
  return rows.slice(1).map(r=>{ const p={}; header.forEach((c,i)=>{ let v=r[i]??''; if(c==='sslLog'||c==='loyaltyLog'||c==='positionHistoryLog'||c==='history'||c==='file201Uploads'||c==='postgraduateLog'){ try{v=JSON.parse(v||'[]');}catch(_){v=[];} } p[c]=v; }); return p; });
}
function rowsFromUsers(){ return [USER_COLS, ...users.map(u=>USER_COLS.map(c=>u[c] ?? ''))]; }
function usersFromRows(rows){
  if(!rows || rows.length<2) return [];
  const header = rows[0];
  return rows.slice(1).map(r=>{ const u={}; header.forEach((c,i)=>u[c]=r[i]??''); return u; });
}
async function googleTestConnection(){
  try{ await appsScriptCall('ping', {}); toast('Backend connected successfully.'); }
  catch(err){ showAlert('Connection failed: ' + err.message); }
}
const SHEETS_CELL_LIMIT = 50000;
function findOversizedCells(sheetsData){
  const problems = [];
  Object.entries(sheetsData).forEach(([sheetName, rows])=>{
    if(!rows.length) return;
    const header = rows[0];
    rows.slice(1).forEach((row, ri)=>{
      row.forEach((cell, ci)=>{
        if(String(cell||'').length > SHEETS_CELL_LIMIT){
          const label = sheetName==='Personnel' ? (fullName({firstName:row[header.indexOf('firstName')], lastName:row[header.indexOf('lastName')], middleName:''}) || 'row '+(ri+2))
            : sheetName==='Schools' ? (row[header.indexOf('name')] || 'row '+(ri+2))
            : 'row '+(ri+2);
          problems.push(`${sheetName} — ${label} — "${header[ci]}" field (${String(cell).length.toLocaleString()} characters)`);
        }
      });
    });
  });
  return problems;
}
let saveInProgress = false;
async function googleSaveAll(){
  if(saveInProgress){ toast('A save is already in progress — please wait for it to finish.'); return; }
  saveInProgress = true;
  try{
    // Before overwriting Users, protect against this specific device's local copy being behind —
    // if the backend already has a linkedPersonId for someone that this device doesn't know
    // about (e.g. set from another admin session), patch it in locally first so this save can't
    // silently erase it. This is the same class of protection already applied to Pending, now
    // extended to the one Users field that's caused real, confirmed data loss in practice.
    // Uses a dedicated, lightweight action (Users only) rather than a full loadAll, since this
    // check only ever needs one sheet, not the entire dataset — cuts what used to be a full
    // second copy of everything into a small, fast request instead.
    if(isGoogleConfigured()){
      try{
        const res = await appsScriptCall('getUsersOnly', {});
        const backendUsers = usersFromRows(res.Users || []);
        backendUsers.forEach(bu=>{
          const localUser = users.find(u=>u.username===bu.username);
          if(localUser && !localUser.linkedPersonId && bu.linkedPersonId){ localUser.linkedPersonId = bu.linkedPersonId; }
        });
      }catch(e){ /* if this safety check itself fails, proceed with the save rather than blocking it entirely */ }
    }
    const schoolRows = [['id','name','createdAt','archived','logo'], ...schools.map(s=>[s.id,s.name,s.createdAt, s.archived?'true':'false', s.logo||''])];
    // Pending is deliberately NOT included here anymore. It's now managed exclusively through
    // targeted, safe actions (a submission syncing itself in, and Approve/Reject each updating
    // only their own row) — never as part of this blanket save. Including it here let a stale
    // local copy of Pending silently overwrite and destroy submissions that arrived directly on
    // the backend but that this device didn't yet know about — which is exactly what happened
    // when Auto-Save fired between an employee's submission landing on the Sheet and the admin
    // pulling it in locally, wiping out the submission.
    personnel.forEach(p=>trimHistoryToFit(p));
    const payload = { Personnel: rowsFromPersonnel(), Schools: schoolRows, Users: rowsFromUsers() };
    const problems = findOversizedCells(payload);
    if(problems.length){
      showAlert('Save stopped before reaching Google — these fields are too large for a Sheets cell (50,000 character limit):\n\n' + problems.join('\n') + '\n\nThis is almost always an embedded photo or logo. Try re-uploading a smaller/simpler image for the field(s) listed above, then save again.');
      return;
    }
    await appsScriptCall('saveAll', payload);
    toast('Saved to backend (Pending is synced separately and automatically)'); logActivity('Saved data to Google Sheets backend');
  }catch(err){ showAlert('Save failed: ' + err.message); }
  finally{ saveInProgress = false; }
}

      const remoteRows = res.Pending.slice(1).map(r=>{ const o={}; cols.forEach((c,i)=>o[c]=r[i]??''); return o; }).filter(r=>r.status!=='Rejected' && r.status!=='Approved');

async function refreshMyAccountLink(shouldRender){
  if(shouldRender===undefined) shouldRender = true;
  if(!isGoogleConfigured() || !session.user || isAdmin()) return;
  try{
    const res = await appsScriptCall('loadAll', {});
    const loadedUsers = usersFromRows(res.Users || []);
    const fresh = loadedUsers.find(u=>u.username===session.user.username);
    if(fresh){
      // Never let a fetched result silently downgrade an already-correct link back to blank —
      // if we already have a linkedPersonId locally and this fetch came back without one, that's
      // more likely a transient/incomplete read than a genuine "someone unlinked this account"
      // event, so we keep the better local value rather than trust the worse fetched one.
      if(!fresh.linkedPersonId && session.user.linkedPersonId) fresh.linkedPersonId = session.user.linkedPersonId;
      const idx = users.findIndex(u=>u.username===fresh.username);
      if(idx>=0) users[idx] = fresh; else users.push(fresh);
      session.user = fresh;
      // Always refresh personnel/schools here, even if the linkedPersonId value itself didn't
      // change — the ID can already be correct locally while the matching personnel record is
      // still missing or stale, which silently breaks the linked-record lookup the same way an
      // outdated ID would, just for a different underlying reason.
      if(res.Personnel) personnel = personnelFromRows(res.Personnel);
      if(res.Schools && res.Schools.length>1){ schools = res.Schools.slice(1).map(r=>({ id:r[0], name:r[1], createdAt:r[2], archived: r[3]==='true', logo: r[4]||'' })); }
      // Only actually re-render if explicitly asked to (e.g. at login, to route to the right
      // page). When triggered by simply opening the New Hire/Update form, we deliberately don't
      // force a re-render — the underlying data is still updated silently either way, and the
      // submit handler reads that live data directly rather than depending on a re-render, so
      // there's no need to risk disrupting someone who may already be typing into the form.
      if(shouldRender) render();
    }
  }catch(e){ console.log('Could not refresh account link status: ' + e.message); }
}
async function checkMyUpdateStatus(){
  try{
    const myLocalSub = pending.find(p=>p.submittedByUsername===session.user?.username);
    if(!myLocalSub){ toast('No submission on file to check.'); return; }
    const res = await appsScriptCall('loadPendingOnly', {});
    const cols = (res.Pending && res.Pending[0]) || [];
    const remoteRows = res.Pending && res.Pending.length>1 ? res.Pending.slice(1).map(r=>{ const o={}; cols.forEach((c,i)=>o[c]=r[i]??''); return o; }) : [];
    const mine = remoteRows.find(r=>r._uid===myLocalSub._uid);
    if(mine && mine.status==='Rejected'){
      pending = pending.filter(p=>p._uid!==myLocalSub._uid);
      render();
      showAlert(`Your request was reviewed and not approved.${mine.rejectionReason ? '\n\nReason given: '+mine.rejectionReason : ''}\n\nYou're welcome to make corrections and submit another request.`);
    } else if(mine && mine.status==='Approved'){
      pending = pending.filter(p=>p._uid!==myLocalSub._uid);
      render();
      toast('Your request was approved — your profile now reflects the update.');
    } else if(mine){
      toast('Still awaiting admin review — nothing new yet.');
    } else {
      // Genuinely not found remotely at all — either it never synced in the first place, or
      // (now that resolved records are kept, not deleted) something unexpected happened.
      const neverConfirmedSynced = myLocalSub._syncConfirmed===false;
      pending = pending.filter(p=>p._uid!==myLocalSub._uid);
      render();
      if(neverConfirmedSynced){
        showAlert("This submission doesn't appear to have reached your school's shared system in the first place — it looks like it never fully sent. Please go to Request an Update and submit it again. If this keeps happening, let your admin know.");
      } else {
        showAlert("Your submission couldn't be found on the shared system, and its outcome is unclear. Please contact your admin directly to check on it.");
      }
    }
  }catch(err){ showAlert('Could not check your submission status: ' + err.message); }
}

async function handleFile201Upload(p, label, fileInput, uploaderName){
  if(!p){ showAlert('No record selected.'); return; }
  const file = fileInput && fileInput.files[0];
  if(!file){ showAlert('Please choose a PDF file first.'); return; }
  if(file.type !== 'application/pdf'){ showAlert('Only PDF files are accepted for 201 documents.'); return; }
  const MAX_BYTES = 10 * 1024 * 1024;
  if(file.size > MAX_BYTES){ showAlert('This file is larger than 10MB. Please compress the PDF first (search "compress PDF online" for a free tool), then try uploading again.'); return; }
  if(!isGoogleConfigured()){ showAlert('Connect a Google backend in Settings first — 201 document uploads need it to store the file.'); return; }
  try{
    const b64 = await new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result.split(',')[1]); r.onerror=reject; r.readAsDataURL(file); });
    const res = await appsScriptCall('uploadPersonDocument', { filename: file.name, base64: b64, personId: p._uid, personName: fullName(p) });
    if(!res.url) throw new Error('Backend did not return a file URL.');
    p.file201Uploads = p.file201Uploads || [];
    p.file201Uploads.unshift({ url: res.url, label: label||'', uploadedAt: new Date().toISOString(), filename: file.name, uploadedBy: uploaderName||'' });
    logActivity(`Uploaded a 201 document for ${fullName(p)}`);
    // The file itself is already safely in Drive at this point — but that record of it existing
    // (what actually drives "on file, last updated") has so far only ever lived in this browser's
    // memory. Employees have no other way to save at all (auto-save is admin-only), so without this
    // explicit save, the upload would appear to vanish the moment the page is left or refreshed,
    // even though the underlying file never moved.
    try{ await googleSaveAll(); }catch(e){ /* googleSaveAll already surfaces its own error to the user */ }
    render(); toast('201 document uploaded');
  }catch(err){ showAlert('Upload failed: ' + err.message); }
}

/* ============================================================= DATE / AUTOMATION HELPERS ============================================================= */
function parseD(str){ if(!str) return null; const d = new Date(str); return isNaN(d) ? null : d; }
function addYears(date, n){ const d = new Date(date); d.setFullYear(d.getFullYear()+n); return d; }
function fmtDate(d){ if(!d) return '—'; const dateObj = (d instanceof Date) ? d : new Date(d); if(isNaN(dateObj)) return typeof d==='string' ? d : '—'; return dateObj.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }
function formatDMY(isoStr){ if(!isoStr) return ''; const parts = String(isoStr).split('-'); if(parts.length!==3) return isoStr; const [y,m,d] = parts; return `${d}/${m}/${y}`; }
function daysBetween(a,b){ return Math.round((b-a)/(24*3600*1000)); }
function yearsOfService(p){ const start = parseD(p.originalAppointmentDate) || parseD(p.firstDayOfService); if(!start) return null; return ((Date.now()-start.getTime())/(365.25*24*3600*1000)).toFixed(1); }
function formatYearsOfService(p){
  const start = parseD(p.originalAppointmentDate) || parseD(p.firstDayOfService);
  if(!start) return null;
  const now = new Date();
  let years = now.getFullYear() - start.getFullYear();
  let months = now.getMonth() - start.getMonth();
  if(now.getDate() < start.getDate()) months -= 1;
  if(months < 0){ months += 12; years -= 1; }
  if(years < 0) return null;
  const yPart = `${years} year${years===1?'':'s'}`;
  const mPart = `${months} month${months===1?'':'s'}`;
  if(years===0 && months===0) return 'Less than a month';
  if(years===0) return mPart;
  if(months===0) return yPart;
  return `${yPart} and ${mPart}`;
}
// Per Division payroll guidance: step increment counting is based on Date of Last Promotion if
// one is on file (a promotion is the only thing that resets the step count), otherwise First Day
// of Service (the person's original, career-long start date — fixed regardless of any later
// reassignment or detail), falling back to Original Appointment Date only if neither is set.
// First Day of Service in Current Station is a separate, purely informational field for
// reassigned/detailed/transferred personnel and is never used in this calculation.
function stepAnchorRaw(p){
  if(p.dateLastPromotion) return p.dateLastPromotion;
  if(p.firstDayOfService) return p.firstDayOfService;
  return p.originalAppointmentDate || '';
}
function nextStepIncrementDate(p){ const anchor = parseD(stepAnchorRaw(p)); if(!anchor) return null; const base = parseD(p.lastStepIncrementProcessedDate) || anchor; return addYears(base, settings.stepIncrementYears); }
function computeProposedStep(p){
  const anchorNow = stepAnchorRaw(p);
  const anchorNowParsed = parseD(anchorNow);
  const anchorSnapshotParsed = parseD(p.stepAnchorSnapshot);
  // Compare the actual calendar date, not the raw text — this way, a date that's merely
  // reformatted between saves (e.g. "October 24, 1993" vs an ISO timestamp for the same day)
  // is correctly recognized as the same date, and doesn't falsely trigger a "promotion
  // detected, reset to Step 1" when nothing actually changed.
  const resetting = !anchorSnapshotParsed || !anchorNowParsed || anchorSnapshotParsed.getTime() !== anchorNowParsed.getTime();
  const proposedStep = resetting ? 1 : Math.min((p.stepNumber||1)+1, STEP_MAX);
  return { resetting, proposedStep, anchorNow };
}
function nextLoyaltyDate(p){ const anchor = parseD(p.originalAppointmentDate); if(!anchor) return null; if(p.lastLoyaltyAwardDate) return addYears(parseD(p.lastLoyaltyAwardDate), settings.loyaltyIntervalYears); return addYears(anchor, settings.loyaltyFirstYears); }
function dueStatus(dateObj){ if(!dateObj) return null; const days = daysBetween(new Date(), dateObj); if(days<0) return {cls:'over', label:`Overdue ${Math.abs(days)}d`, days}; if(days<=settings.notifyFinalDays) return {cls:'urgent', label:`Due in ${days}d`, days}; if(days<=settings.notifyEarlyDays) return {cls:'soon', label:`Due in ${days}d`, days}; return null; }
function birthdayDueStatus(dateObj){
  if(!dateObj) return null;
  const days = daysBetween(new Date(), dateObj);
  const window = settings.birthdayNotifyDaysBefore ?? 1;
  if(days===0) return {cls:'urgent', label:'Today!', days};
  if(days>0 && days<=window) return {cls:'soon', label:`In ${days}d`, days};
  return null;
}
function activePersonnel(){ return personnel.filter(p=>p.schoolId===currentSchoolId); }
// A person still "counts" as present/serving at this station unless they're unambiguously separated
// (Resigned/Retired), or their Reassigned/Transfer of Service/Contract Ended status has actually taken
// effect (Last Day of Service is filled in). "Detail" always counts — being detailed elsewhere doesn't
// mean absent from this station; it means they ARE the ones currently serving here.
function isCountedActive(p){
  if(['Resigned','Retired','Recalled'].includes(p.employeeStatus)) return false;
  if(['Reassigned','Transfer of Service','Contract Ended','Detail'].includes(p.employeeStatus) && p.lastDayOfService) return false;
  return true;
}
function nextBirthdayDate(p){
  const dob = parseD(p.dob); if(!dob) return null;
  const today = new Date();
  let next = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
  if(next < today) next = new Date(today.getFullYear()+1, dob.getMonth(), dob.getDate());
  return next;
}
function isBirthdayToday(p){
  const dob = parseD(p.dob); if(!dob) return false;
  const today = new Date();
  return dob.getMonth()===today.getMonth() && dob.getDate()===today.getDate();
}
function isDueToday(dateObj){
  if(!dateObj) return false;
  const today = new Date();
  return dateObj.getFullYear()===today.getFullYear() && dateObj.getMonth()===today.getMonth() && dateObj.getDate()===today.getDate();
}
function computeAlerts(){
  const alerts = [];
  activePersonnel().forEach(p=>{
    if(!isCountedActive(p)) return;
    const si = nextStepIncrementDate(p); const siDue = dueStatus(si); if(siDue) alerts.push({p, type:'Step Increment', date:si, due:siDue});
    const lo = nextLoyaltyDate(p); const loDue = dueStatus(lo); if(loDue) alerts.push({p, type:'Loyalty Award', date:lo, due:loDue});
    if(settings.birthdayNotifyEnabled){
      const bd = nextBirthdayDate(p); const bdDue = birthdayDueStatus(bd);
      if(bdDue && p.birthdayAcknowledgedDate !== fmtDate(bd)) alerts.push({p, type:'Birthday', date:bd, due:bdDue});
    }
  });
  alerts.sort((a,b)=>a.due.days-b.due.days);
  return alerts;
}
let autoSaveTimer = null;
// Auto-logout after inactivity — protects an unattended, still-logged-in device the same way
// the employee print restriction protects against misuse of an unattended one. Applies to both
// Admin and Employee accounts equally. Any click, keypress, or mouse movement resets the timer;
// checked every 30 seconds, independent of whether the app is otherwise doing anything.
let lastActivityAt = Date.now();
function markActivity(){ lastActivityAt = Date.now(); }
function checkAutoLogout(){
  if(!session.user) return;
  const minutes = settings.autoLogoutMinutes || 15;
  if(Date.now() - lastActivityAt > minutes*60*1000){

    session.user = null; state.view='dashboard';

/* ============================================================= HISTORY / SNAPSHOTS ============================================================= */
function snapshot(p, label){
  const clone = {}; Object.values(FIELD_GROUPS).flat().forEach(([k])=>{ if(k!=='photo') clone[k]=p[k]; });
  clone._label = label; clone._at = new Date().toISOString();
  p.history = p.history || []; p.history.push(clone);
  trimHistoryToFit(p);
}
// Keeps a person's History log safely under the Sheets 50,000-character cell limit, however many
// fields a snapshot captures — trims the OLDEST entries first, and always keeps at least the most
// recent one. Called both when a new snapshot is added, and defensively right before every save,
// so a record that got oversized before this safeguard existed self-heals on its very next save
// rather than staying permanently stuck.
const HISTORY_CHAR_BUDGET = 35000;
function trimHistoryToFit(p){
  if(!p.history || !p.history.length) return;
  while(p.history.length>1 && JSON.stringify(p.history).length > HISTORY_CHAR_BUDGET) p.history.shift();
}

/* ============================================================= HELPERS ============================================================= */
function fullName(p){ return `${p.firstName||''} ${p.middleName ? p.middleName[0]+'. ' : ''}${p.lastName||''}${p.nameSuffix ? ' '+p.nameSuffix : ''}`.replace(/\s+/g,' ').trim() || 'Unnamed Record'; }
// Checks for a likely-duplicate record already on file — same first + last name (case/space
// insensitive) and, if a birthdate is given, the same date of birth too. Used before creating a
// new record (Add Personnel, approving a New Hire submission, CSV import) to catch both the
// re-approval bug this app has hit before, and ordinary human error.
function findPossibleDuplicate(firstName, lastName, dob, excludeUid){
  const norm = s => String(s||'').trim().toLowerCase();
  const fn = norm(firstName), ln = norm(lastName);
  if(!fn || !ln) return null;
  return personnel.find(p=>{
    if(p.schoolId!==currentSchoolId) return false;
    if(excludeUid && p._uid===excludeUid) return false;
    if(norm(p.firstName)!==fn || norm(p.lastName)!==ln) return false;
    if(dob && p.dob) return norm(p.dob)===norm(dob);
    return true;
  }) || null;
}
function formatPersonName(p){
  if(settings.nameDisplayOrder==='last-first'){
    const mi = p.middleName ? p.middleName[0]+'.' : '';
    return `${p.lastName||''}, ${p.firstName||''}${p.nameSuffix ? ' '+p.nameSuffix : ''}${mi ? ' '+mi : ''}`.replace(/\s+/g,' ').trim().replace(/^,\s*/,'') || 'Unnamed Record';
  }
  return fullName(p);
}
function initials(p){ return ((p.firstName?.[0]||'')+(p.lastName?.[0]||'')).toUpperCase() || '?'; }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toDriveThumb(url){ if(!url) return ''; const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/); return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w300` : url; }
function photoSrc(value){ if(!value) return ''; if(value.startsWith('data:image')) return value; return toDriveThumb(value); }
function photoOrFallback(p, sizeClass){
  const thumb = photoSrc(p.photo);
  const fb = sizeClass==='photo' ? 'ph-fallback' : (sizeClass==='profile-photo' ? 'ph-fallback-xl' : 'ph-fallback-lg');
  if(thumb) return `<img class="${sizeClass}" src="${esc(thumb)}" alt="${esc(fullName(p))}" onerror="this.outerHTML='<div class=&quot;${fb}&quot;>${esc(initials(p))}</div>'">`;
  return `<div class="${fb}">${esc(initials(p))}</div>`;
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>${esc(msg)}`; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ============================================================= INIT ============================================================= */
const AUTOSAVE_KEY = 'schoolPersonnelDB_autosave_v1';
function persistLocal(){
  try{ localStorage.setItem(AUTOSAVE_KEY, serializeAll()); }
  catch(e){ /* storage unavailable or full — silently skip, Export Backup still works */ }
}
function init(){
  let restored = false;
  try{
    const saved = localStorage.getItem(AUTOSAVE_KEY);
    if(saved){ loadAll(JSON.parse(saved)); restored = true; }
  }catch(e){ /* ignore corrupt/unavailable local data, fall back to blank state */ }
  if(!restored){
    const s = blankSchool('');
    schools = [s]; currentSchoolId = s.id;
    personnel = []; pending = []; users = []; activityLog = [];
    quickLinks = defaultQuickLinks();
    applyTheme();
  }
  document.getElementById('yr').textContent = new Date().getFullYear();
  render();
  // Retry the shared backend sync any time this device doesn't have any accounts of its own yet —
  // not just on its very first-ever load. This matters because a device can end up with an empty
  // "shell" saved locally (e.g. the sync was interrupted before it finished) — without this check,
  // that device would otherwise stop trying to sync forever. Devices that already have real local
  // accounts are left alone, so we never silently overwrite someone's unsaved local edits.
  if(users.length===0 && isGoogleConfigured()) attemptAutoSync();
  loadAnnouncement();
  loadMusicSettings();
}
let syncStatus = 'idle'; // 'idle' | 'syncing' | 'success' | 'error' | 'unconfigured'
let syncErrorDetail = '';
async function attemptAutoSync(){
  if(!isGoogleConfigured()){ syncStatus='unconfigured'; render(); return; }
  syncStatus = 'syncing'; render();
  try{
    const res = await appsScriptCall('loadAll', {});
    if(res.Personnel) personnel = personnelFromRows(res.Personnel);
    if(res.Schools && res.Schools.length>1){ schools = res.Schools.slice(1).map(r=>({ id:r[0], name:r[1], createdAt:r[2], archived: r[3]==='true', logo: r[4]||'' })); if(!schools.find(s=>s.id===currentSchoolId)) currentSchoolId = schools.find(s=>!s.archived)?.id || schools[0]?.id; }
    if(res.Pending && res.Pending.length>1){ const cols = res.Pending[0]; pending = res.Pending.slice(1).map(r=>{ const o={}; cols.forEach((c,i)=>o[c]=r[i]??''); return o; }).filter(r=>r.status!=='Rejected' && r.status!=='Approved'); }
    const loadedUsers = usersFromRows(res.Users || []);
    if(loadedUsers.length){
      users = loadedUsers;
      // Real accounts just arrived from the shared backend — if we were stuck showing the
      // first-run "Create Admin Account" screen while this was loading, switch to the normal
      // Login screen now instead of leaving the user stranded with no way to log in.
      if(state.view==='signup') state.view='login';
    }
    syncStatus = 'success';
    render();
  }catch(e){ syncStatus = 'error'; syncErrorDetail = e.message || String(e); render(); }
}
function blankSchool(name){ return { id: uid(), name, createdAt: new Date().toISOString(), archived:false, logo:'' }; }

/* ============================================================= THEME ============================================================= */
function applyTheme(){
  const root = document.documentElement;
  if(settings.theme.mode==='photo' && settings.theme.photo){
    document.body.style.setProperty('--bgphoto', `url(${settings.theme.photo})`); document.body.classList.add('has-photo-bg');
  } else {
    document.body.style.setProperty('--bgphoto','none'); document.body.classList.remove('has-photo-bg');
    root.style.setProperty('--court', settings.theme.color || '#0B4F4A');
    root.style.setProperty('--court-dark', shade(settings.theme.color || '#0B4F4A', -18));
  }
}
function shade(hex, pct){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+Math.round(2.55*pct), g=((n>>8)&255)+Math.round(2.55*pct), b=(n&255)+Math.round(2.55*pct);
  r=Math.min(255,Math.max(0,r)); g=Math.min(255,Math.max(0,g)); b=Math.min(255,Math.max(0,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function togglePersonnelActionsPopup(btn){
  const popup = document.getElementById('personnelActionsPopup');
  if(!popup) return;
  if(popup.style.display==='block'){ popup.style.display='none'; return; }
  const rect = btn.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.minWidth = Math.max(rect.width, 200) + 'px';
  const popupHeight = popup.offsetHeight;
  const spaceBelow = window.innerHeight - rect.bottom;
  // Drop down directly below the button, anchored to its own left edge — this keeps the popup
  // read as an extension of that specific button rather than a stray box floating over unrelated
  // dashboard content off to the right.
  if(popupHeight > spaceBelow - 12){ popup.style.top = Math.max(8, rect.top - popupHeight - 4) + 'px'; }
  else { popup.style.top = (rect.bottom + 4) + 'px'; }
  popup.style.left = rect.left + 'px';
}
function closePersonnelActionsPopup(){
  const popup = document.getElementById('personnelActionsPopup');
  if(popup) popup.style.display = 'none';
}
document.addEventListener('click', (ev)=>{

});

  if(pbadge){ if(pendingHere.length){ pbadge.style.display='inline-block'; pbadge.textContent=pendingHere.length; } else pbadge.style.display='none'; }

  if(pbadgeSummary){ if(pendingHere.length){ pbadgeSummary.style.display='inline-block'; pbadgeSummary.textContent=pendingHere.length; } else pbadgeSummary.style.display='none'; }

  const views = { dashboard:renderDashboard, directory:renderDirectory, list:renderPersonnelList, profile:renderProfile, add:renderAddForm,
    newhire:renderNewHireForm, pending:renderPending, notifications:renderNotifications, settings:renderSettings, about:renderAbout,
    login:renderLogin, signup:renderSignup, myprofile:renderMyProfile, quicklinks:renderQuickLinks, file201checklist:renderFile201Checklist, csvimport:renderCsvImport, transferimport:renderTransferImport };
  document.getElementById('app').innerHTML = (views[state.view] || renderDashboard)();
  bindDynamicEvents();
  updatePolling();
}
// Deliberately kept to exactly one active timer at a time, tied to whichever page is actually on
// screen — and deliberately NEVER active on the New Hire/Update form itself, since that's the one
// page where an unexpected background re-render could disrupt someone mid-typing (the exact class
// of bug already fixed once in this app). Only two genuinely read-only pages poll: Pending
// Approvals for admins, and My Profile for employees.
let pollTimer = null, pollingView = null;
function updatePolling(){
  const wantsPolling = isGoogleConfigured() && (
    (state.view==='pending' && isAdmin()) ||
    (state.view==='myprofile' && isEmployee())
  );
  if(!wantsPolling){
    if(pollTimer){ clearInterval(pollTimer); pollTimer=null; pollingView=null; }
    return;
  }
  if(pollingView===state.view) return; // already polling the right page — don't restart the timer on every render
  if(pollTimer) clearInterval(pollTimer);
  pollingView = state.view;
  const fn = state.view==='pending' ? pollPendingQuiet : pollMyProfileQuiet;
  pollTimer = setInterval(fn, state.view==='pending' ? 35000 : 40000);
}
async function pollPendingQuiet(){
  if(state.view!=='pending' || !isAdmin() || !isGoogleConfigured()) return;
  try{
    const res = await appsScriptCall('loadPendingOnly', {});
    if(res.Pending && res.Pending.length>1){
      const cols = res.Pending[0];
      const remoteRows = res.Pending.slice(1).map(r=>{ const o={}; cols.forEach((c,i)=>o[c]=r[i]??''); return o; }).filter(r=>r.status!=='Rejected' && r.status!=='Approved');
      let added=0, updated=0;
      remoteRows.forEach(r=>{
        const idx = pending.findIndex(p=>p._uid===r._uid);
        if(idx>=0){ if(JSON.stringify(pending[idx])!==JSON.stringify(r)){ pending[idx]=r; updated++; } } else { pending.push(r); added++; }
      });
      if(added || updated){ render(); toast(`🔄 ${added} new, ${updated} updated submission(s) arrived`); }
    }
  }catch(e){ /* stay quiet in the background — the manual "Check for New Submissions" button still surfaces real errors */ }
}
async function pollMyProfileQuiet(){
  if(state.view!=='myprofile' || !session.user || isAdmin() || !isGoogleConfigured()) return;
  try{
    const res = await appsScriptCall('loadAll', {});
    const loadedUsers = usersFromRows(res.Users || []);
    const fresh = loadedUsers.find(u=>u.username===session.user.username);
    if(!fresh) return;
    if(!fresh.linkedPersonId && session.user.linkedPersonId) fresh.linkedPersonId = session.user.linkedPersonId;
    const userChanged = JSON.stringify(fresh) !== JSON.stringify(session.user);
    const freshPersonnel = res.Personnel ? personnelFromRows(res.Personnel) : personnel;
    const personnelChanged = res.Personnel ? JSON.stringify(freshPersonnel) !== JSON.stringify(personnel) : false;
    if(!userChanged && !personnelChanged) return;
    const idx = users.findIndex(u=>u.username===fresh.username);
    if(idx>=0) users[idx]=fresh; else users.push(fresh);
    session.user = fresh;
    if(res.Personnel) personnel = freshPersonnel;
    if(res.Schools && res.Schools.length>1){ schools = res.Schools.slice(1).map(r=>({ id:r[0], name:r[1], createdAt:r[2], archived: r[3]==='true', logo: r[4]||'' })); }
    render(); toast('🔄 Your profile was updated with the latest data.');
  }catch(e){ /* stay quiet in the background — the manual Refresh button still surfaces real errors */ }
}

  if(cur && cur.logo) return `<img src="${esc(cur.logo)}" alt="School logo">`;
  return null;

  const inactive = total-active;
  const male = list.filter(p=>p.sex==='Male').length;
  const female = list.filter(p=>p.sex==='Female').length;
  // Teaching/non-teaching, JHS/SHS, and specialization counts only include currently Active personnel —
  // records for reassigned/resigned/retired/contract-ended staff are retained in full but excluded from these tallies.
  const activeOnly = list.filter(isCountedActive);
  const isTeacher = p => p.workload==='Class Adviser' || p.workload==='Subject Teacher';
  const isNonTeaching = p => p.workload==='School Head' || p.workload==='Admin Staff';
  const teaching = activeOnly.filter(isTeacher);

  const shsCount = activeOnly.filter(p=>p.department==='SHS' && isTeacher(p)).length;

  const specEntries = Object.entries(specGroups).sort((a,b)=>b[1].length-a[1].length);

    ${!publicView ? (()=>{
      const lastBackup = settings.lastBackupAt ? new Date(settings.lastBackupAt) : null;
      const daysSince = lastBackup ? Math.floor((Date.now()-lastBackup.getTime())/(24*3600*1000)) : null;
      const overdue = !lastBackup || daysSince>30;
      const label = !lastBackup ? 'No backup has been made yet on this device' : `Last backup: ${daysSince===0?'today':daysSince+' day'+(daysSince===1?'':'s')+' ago'}`;
      return `<div class="notice ${overdue?'':'blue'}" style="${overdue?'background:#FDECEA;border-color:#E8B4AC;':''}">${overdue?'⚠':'💾'} ${label}${overdue?' — consider making one soon':''}. <a href="#" data-nav="dashboard" onclick="document.getElementById('exportBtn').click(); return false;" style="color:var(--court);font-weight:600;">Export Backup now →</a></div>`;
    })() : ''}
    ${announcement.text ? `<div class="announcement-banner">📢 <div><div class="ann-text">${esc(announcement.text)}</div>${announcement.updatedAt ? `<div class="ann-meta">Posted by ${esc(announcement.updatedBy||'admin')} · ${new Date(announcement.updatedAt).toLocaleString()}</div>` : ''}</div></div>` : ''}

    ${alerts.length ? `<div class="notice">🔔 <strong>${alerts.length} item${alerts.length>1?'s':''}</strong> need attention. <a href="#" data-nav="notifications" style="color:var(--court);font-weight:600;">View Alerts →</a></div>` : ''}

      ${specEntries.length ? (revealNames ? specEntries.map(([spec, people])=>`
        <div style="padding:10px 0; border-bottom:1px solid var(--line);">

    </div>` : ''}
  `;
}

/* ============================================================= DIRECTORY ============================================================= */
function filteredPersonnel(){
  const q = state.search.trim().toLowerCase();
  const list = activePersonnel().filter(p=>{
    if(state.statusFilter!=='All'){
      // "Active" here matches the same definition the Dashboard uses — someone on Detail still
      // counts as active (they're still serving at this station day-to-day) unless a Last Day of
      // Service is on file. Every other filter option still matches the raw status field exactly,
      // so "Detail" can still be selected on its own as a distinct view when wanted.
      if(state.statusFilter==='Active'){ if(!isCountedActive(p)) return false; }
      else if(p.employeeStatus!==state.statusFilter){ return false; }
    }
    if(!q) return true;
    const hay = `${fullName(p)} ${p.employeeId} ${p.deptEmail} ${p.positionTitle} ${p.currentStationAssignment}`.toLowerCase();
    return hay.includes(q);
  });
  if(settings.sortOrder==='alpha'){
    list.sort((a,b)=>{
      const la=(a.lastName||'').toLowerCase(), lb=(b.lastName||'').toLowerCase();
      if(la!==lb) return la.localeCompare(lb);
      return (a.firstName||'').toLowerCase().localeCompare((b.firstName||'').toLowerCase());
    });
  }
  return list;
}

  const list = filteredPersonnel();

const EXPORT_COLUMN_DEFS = (()=>{

      defs.push({ key:k, label, group:groupLabel, getValue:p=>p[k]||'' });
    });
  });
  defs.push({ key:'_yearsOfService', label:'Years in Service', group:'Automated / Summary', getValue:p=>formatYearsOfService(p)||'' });
  defs.push({ key:'_nextStepIncrement', label:'Next Step Increment Date', group:'Automated / Summary', getValue:p=>fmtDate(nextStepIncrementDate(p)) });
  defs.push({ key:'_nextLoyaltyAward', label:'Next Loyalty Award Date', group:'Automated / Summary', getValue:p=>fmtDate(nextLoyaltyDate(p)) });
  defs.push({ key:'_file201Status', label:'201 Documents on File', group:'Automated / Summary', getValue:p=>{ const log=p.file201Uploads||[]; if(!log.length) return 'None uploaded'; return `${log.length} file(s) — last updated ${fmtDate(log[0].uploadedAt)}`; } });

function csvEscape(v){ v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function exportDateStamp(){ const d = new Date(); const mm=String(d.getMonth()+1).padStart(2,'0'); const dd=String(d.getDate()).padStart(2,'0'); return `${mm}${dd}${d.getFullYear()}`; }
function parseCSV(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1 || r[0]!=='');
}

function findPerson(id){
  const p = personnel.find(p=>p._uid===id);
  if(p){
    p.sslLog = p.sslLog || []; p.loyaltyLog = p.loyaltyLog || [];
    p.file201Uploads = p.file201Uploads || [];
    p.positionHistoryLog = p.positionHistoryLog || [];
    p.history = p.history || [];
    // Older snapshots (saved before this fix existed) may still carry a full embedded photo
    // each — strip it out now so previously-bloated records heal automatically instead of
    // needing a manual fix, the next time this record is opened or edited.
    p.history.forEach(h=>{ if(h && h.photo) delete h.photo; });
    if(!p.stepNumber) p.stepNumber = 1;
    if(p.stepAnchorSnapshot===undefined) p.stepAnchorSnapshot = null;
  }
  return p;
}
